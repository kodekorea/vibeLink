<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<style>body{font-family:-apple-system,"Segoe UI",sans-serif;background:#faf9f5;color:#141413;padding:16px;margin:0}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:#141413;margin:0 0 6px}
h3{font-size:14px;color:#141413;margin:0 0 4px}
label{display:block;margin:10px 0 4px;font-size:13px;color:#6c6a64}
input{width:100%;padding:9px;background:#fff;color:#141413;border:1px solid #e6dfd8;border-radius:8px;font-size:14px;box-sizing:border-box}
button{margin-top:12px;margin-right:8px;padding:9px 14px;background:#cc785c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
button:active{background:#a9583e}
button.secondary{background:#efe9de;color:#141413}
.url{word-break:break-all;color:#cc785c;margin-top:8px;min-height:18px;font-size:13px}
.card{background:#efe9de;border-radius:12px;padding:14px;margin:14px 0}
.hint{font-size:12px;color:#6c6a64;line-height:1.5;margin:4px 0}
.ok{color:#5db872;font-size:12px}
pre{font-family:"Cascadia Mono",Consolas,monospace;background:#181715;border:1px solid #252320;border-radius:6px;padding:8px;height:140px;overflow:auto;font-size:11px;color:#a09d96;white-space:pre-wrap}
.status{font-weight:bold;color:#141413}</style></head>
<body>
<h2>MTB Hub</h2>
<div>상태: <span id="status" class="status">-</span></div>
<div class="url" id="url"></div>

<label>포트</label><input id="port" type="number">
<label>암호 (폰에서 연결 시 입력)</label><input id="password" type="text">

<div class="card">
  <h3>외부 접속 — ngrok (집 밖에서도 고정 주소)</h3>
  <div class="hint">
    같은 와이파이면 필요 없어요. 집 밖에서도 쓰려면 ngrok 토큰을 넣으세요.<br>
    ① 가입 → ② 토큰 복사해서 아래 붙여넣기 → 저장. (무료, 고정 주소 자동)
  </div>
  <button class="secondary" id="signup">① ngrok 가입/로그인</button>
  <button class="secondary" id="getToken">② 토큰 복사 페이지 열기</button>
  <label>ngrok 토큰 (authtoken)</label><input id="ngrokToken" type="text" placeholder="여기에 붙여넣기">
  <label>고정 도메인 (선택 — 없으면 비워두기)</label><input id="ngrokDomain" type="text" placeholder="xxxx.ngrok-free.dev">
  <div class="hint" id="ngrokState"></div>
</div>

<div>
  <button id="save">저장</button>
  <button id="toggle">시작/정지</button>
  <button id="qr">QR 페이지</button>
  <button class="secondary" id="proj">projects.json</button>
</div>
<label>로그</label><pre id="logs"></pre>

<script>
const $=s=>document.getElementById(s);
function render(s){
  $('status').textContent = s.running ? '실행 중' : '정지';
  $('url').textContent = s.url || '';
  if (document.activeElement!==$('port')) $('port').value = s.port;
  if (document.activeElement!==$('password')) $('password').value = s.password;
  if (document.activeElement!==$('ngrokToken')) $('ngrokToken').value = s.ngrokToken || '';
  if (document.activeElement!==$('ngrokDomain')) $('ngrokDomain').value = s.ngrokDomain || '';
  $('ngrokState').innerHTML = s.ngrokToken
    ? '<span class="ok">● 외부 접속 켜짐 (ngrok)</span>'
    : '토큰 없음 — 집 안에서는 LAN QR로 접속하세요.';
  $('logs').textContent = (s.logs||[]).join('');
  $('toggle').textContent = s.running ? '정지' : '시작';
}
$('save').onclick = async()=>render(await window.mtb.save({
  port:$('port').value, password:$('password').value,
  ngrokToken:$('ngrokToken').value, ngrokDomain:$('ngrokDomain').value,
}));
$('toggle').onclick = async()=>{ const s=await window.mtb.getState(); render(await (s.running?window.mtb.stop():window.mtb.start())); };
$('qr').onclick = ()=>window.mtb.openQr();
$('proj').onclick = ()=>window.mtb.openProjects();
$('signup').onclick = ()=>window.mtb.openExternal('https://dashboard.ngrok.com/signup');
$('getToken').onclick = ()=>window.mtb.openExternal('https://dashboard.ngrok.com/get-started/your-authtoken');
window.mtb.onState(render);
window.mtb.getState().then(render);
</script></body></html>
