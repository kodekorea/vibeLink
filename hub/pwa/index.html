<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VibeLink</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  /* 라이트(기본, Claude 크림 느낌) */
  :root{color-scheme:light;--bg:#faf9f5;--panel:#f0ebe3;--panel2:#efe9de;--line:#e6dfd8;--accent:#cc785c;--accent-press:#a9583e;--txt:#141413;--mut:#6c6a64;--tint:rgba(204,120,92,.14);--key-border:rgba(204,120,92,.4);--input-bg:#ffffff;--term-bg:#faf9f5;--term-fg:#3d3d3a;--cream:#faf9f5;--ink:#141413;--hairline:#e6dfd8;--card:#efe9de}
  /* 다크 */
  body.theme-dark{color-scheme:dark;--bg:#181715;--panel:#1f1e1b;--panel2:#2a2420;--line:#33302b;--txt:#faf9f5;--mut:#a09d96;--tint:rgba(204,120,92,.12);--key-border:rgba(204,120,92,.28);--input-bg:#0f0d0b;--term-bg:#181715;--term-fg:#faf9f5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #pair{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;padding:24px;background:var(--cream)}
  #pair h2{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);font-weight:500;font-size:34px;letter-spacing:-.5px;margin:0}
  #pair input{font-size:18px;padding:14px;width:240px;max-width:80vw;text-align:center;background:#fff;color:var(--ink);border:1px solid var(--hairline);border-radius:12px}
  .btn,#pairBtn{font-size:16px;font-weight:600;padding:13px 22px;background:var(--accent);color:#fff;border:none;border-radius:12px;box-shadow:0 2px 10px rgba(204,120,92,.35)}
  .btn:active,#pairBtn:active{background:var(--accent-press);filter:none}
  #main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  #bar{display:flex;gap:3px;padding:8px 10px 0 10px;padding-top:calc(8px + env(safe-area-inset-top));overflow-x:auto;background:var(--panel);align-items:flex-end;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .chip{position:relative;display:inline-flex;align-items:center;gap:4px;padding:8px 12px;background:var(--panel2);color:var(--mut);border-top-left-radius:10px;border-top-right-radius:10px;border-bottom-left-radius:0;border-bottom-right-radius:0;white-space:nowrap;font-size:13px;font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;border:1px solid var(--line);margin-bottom:-1px;transition:background-color .15s,color .15s;cursor:pointer}
  .chip.active{background:var(--term-bg);color:var(--txt);border-bottom-color:var(--term-bg);font-weight:600}
  .chip.active::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
  .chip-lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
  .chip-close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:12px;line-height:1;margin-left:4px;color:var(--mut);transition:background-color .15s,color .15s;cursor:pointer}
  .chip-close:hover{background:rgba(0,0,0,0.1);color:var(--txt)}
  body.theme-dark .chip-close:hover{background:rgba(255,255,255,0.15);color:var(--txt)}
  #plus{padding:5px 12px;background:var(--panel2);color:var(--accent);border-radius:6px;font-size:16px;border:1px solid var(--line);flex:0 0 auto;margin-left:4px;margin-bottom:3px;cursor:pointer;font-weight:bold;transition:background-color .15s}
  #plus:hover{background:var(--line)}
  #term{flex:1 1 auto;min-height:0;position:relative;padding:2px 4px}
  #term .xterm-viewport{overflow-y:auto !important;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
  /* 모바일: 손가락이 닿는 캔버스(.xterm-screen) 레이어의 네이티브 제스처를 끄고
     스크롤/스와이프를 JS(touchmove)에서 직접 구동 — Android WebView 씹힘 방지 */
  #term .xterm-screen,#term .xterm-screen canvas{touch-action:none}
  #toBottom{position:absolute;right:14px;bottom:14px;z-index:5;display:none;width:44px;height:44px;border-radius:22px;background:var(--accent);color:#fff;border:none;font-size:20px;box-shadow:0 3px 12px rgba(204,120,92,.35)}
  #toBottom.show{display:block}
  #keybar{display:flex;gap:7px;padding:8px 10px;background:var(--panel);overflow-x:auto;flex:0 0 auto;border-top:1px solid var(--line)}
  .key{flex:0 0 auto;min-width:46px;padding:11px 12px;background:var(--panel2);color:var(--txt);border:1px solid var(--key-border);border-radius:10px;font-size:15px;font-weight:500;text-align:center;user-select:none;-webkit-user-select:none}
  .key:active{background:var(--accent);border-color:transparent;color:#fff}
  .key-enter{min-width:84px;background:var(--tint);color:var(--accent);font-weight:700}
  #snippets{display:none;gap:7px;padding:8px 10px;background:var(--bg);overflow-x:auto;flex:0 0 auto;border-top:1px solid var(--line)}
  #snippets.show{display:flex}
  .snip{flex:0 0 auto;padding:9px 14px;background:var(--tint);color:var(--accent);border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--key-border)}
  .snip.add{background:var(--panel2);color:var(--txt);border-color:var(--key-border)}
  #inputbar{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);flex:0 0 auto;align-items:flex-end;border-top:1px solid var(--line)}
  #inputbar input{flex:1;font-size:16px;padding:14px 14px;min-height:50px;background:var(--input-bg);color:var(--txt);border:1px solid var(--line);border-radius:12px}
  #inputbar input#line{flex:1}
  #inputbar input:focus{outline:none;border-color:var(--accent)}
  #attach.busy{opacity:.5}
  #send{flex:0 0 auto;width:54px;min-height:50px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:20px;box-shadow:0 2px 10px rgba(204,120,92,.35);transition:background-color .2s}
  #send:active{background:var(--accent-press)}
  /* WS 끊김 — 입력이 전송되지 않음을 버튼 색으로 표시 */
  #send.offline{background:#9b9b9b;box-shadow:none}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(2px)}
  #modal.show{display:flex}
  #sheet{background:var(--panel);width:92%;max-width:420px;max-height:80%;overflow:auto;border-radius:16px;padding:18px;border:1px solid var(--line)}
  #sheet h3{margin:0 0 12px;font-size:17px}
  .row{padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;color:var(--txt)}
  .row:active{background:var(--panel2)}
  .row-fav{display:flex;align-items:center;gap:8px}
  .fav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fav-del{flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:15px;color:var(--mut);font-size:18px;background:var(--panel2)}
  .fav-del:active{background:#c64545;color:#fff}
  .sheet-actions{display:flex;gap:8px;margin-top:14px}
  .sheet-actions .btn{flex:1}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .hidden{display:none !important}
  body.embed #bar{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="pair">
    <h2>VibeLink</h2>
    <input id="pw" type="password" placeholder="암호" autocomplete="off">
    <button id="pairBtn">연결</button>
    <div id="pairMsg" style="color:#c64545;font-size:13px"></div>
  </div>
  <div id="main" class="hidden">
    <div id="bar"></div>
    <div id="term"><button id="toBottom" title="맨 아래로">⤓</button></div>
    <div id="keybar">
      <div class="key" data-k="esc">Esc</div>
      <div class="key key-enter" data-k="enter">⏎ Enter</div>
      <div class="key" data-k="down">↓</div>
      <div class="key" data-k="up">↑</div>
      <div class="key" data-k="left">←</div>
      <div class="key" data-k="right">→</div>
      <div class="key" data-k="tab">Tab</div>
      <div class="key" data-k="stab" title="Shift+Tab (agent)">⇧⇥</div>
      <div class="key" data-k="ctrlc">^C</div>
      <div class="key" data-k="copy" data-i18n="copy">Copy</div>
      <div class="key" data-k="fdec">A−</div>
      <div class="key" data-k="finc">A+</div>
      <div class="key" id="snipToggle" title="snippets">★</div>
      <div class="key" id="attach" title="attach image/file">📎</div>
      <div class="key" data-k="theme" title="theme">◐</div>
    </div>
    <input id="attachFile" type="file" accept="image/*,.pdf,.txt,.md" style="display:none">
    <div id="snippets"></div>
    <div id="inputbar">
      <input id="line" placeholder="명령 입력" autocomplete="off" autocapitalize="off">
      <button id="send" title="전송">▶</button>
    </div>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const deviceId = (() => {
  let id = localStorage.getItem('mtb_device');
  if (!id) { id = 'dev-' + Math.random().toString(36).slice(2); localStorage.setItem('mtb_device', id); }
  return id;
})();
const $ = s => document.querySelector(s);
const EMBED = new URLSearchParams(location.search).has('embed');
const WANT_SESSION = new URLSearchParams(location.search).get('session') || '';
const QLANG = new URLSearchParams(location.search).get('lang') || '';
const SAFE_BOTTOM = parseInt(new URLSearchParams(location.search).get('safe') || '0', 10) || 0;
let ws, term, fit, sessions = [], active = '';

// ── i18n (영어 기본, 글로벌). ?lang=ko 또는 localStorage mtb_lang로 전환 ──
const STR = {
  en: { authFail:'Authentication failed', cmdPlaceholder:'Type a command', copy:'Copy', copied:'Copied', connect:'Connect', password:'Password',
    newSessionPick:'New session — pick a project', browseFolder:'Browse folders', close:'Close', drives:'Drives', up:'⬆ Up',
    startHere:'Start session here', doneWaiting:'Done / waiting for input', session:'Session', uploadFail:'Upload failed',
    deletePrefix:'Delete', delete:'Delete', saveCurrent:'＋ Save current', newFolder:'＋ New folder', newFolderPrompt:'New folder name', mkdirFail:'Could not create folder' },
  ko: { authFail:'인증 실패', cmdPlaceholder:'명령 입력', copy:'복사', copied:'복사됨', connect:'연결', password:'암호',
    newSessionPick:'새 세션 — 프로젝트 선택', browseFolder:'폴더 찾아보기', close:'닫기', drives:'드라이브', up:'⬆ 상위',
    startHere:'여기서 세션 시작', doneWaiting:'완료 / 입력 대기', session:'세션', uploadFail:'업로드 실패',
    deletePrefix:'삭제', delete:'삭제', saveCurrent:'＋ 현재 입력 저장', newFolder:'＋ 새 폴더', newFolderPrompt:'새 폴더 이름', mkdirFail:'폴더를 만들 수 없어요' },
};
const LANG = (QLANG || localStorage.getItem('mtb_lang') || 'en').startsWith('ko') ? 'ko' : 'en';
function T(k){ return (STR[LANG] && STR[LANG][k]) || STR.en[k] || k; }
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  const pw = $('#pw'); if (pw) pw.placeholder = T('password');
  const pb = $('#pairBtn'); if (pb) pb.textContent = T('connect');
  const ln = $('#line'); if (ln) ln.placeholder = T('cmdPlaceholder');
}

function api(p, opts){ return fetch(p, Object.assign({ headers:{ 'Content-Type':'application/json' } }, opts)); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#pairBtn').onclick = pair;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') pair(); });
async function pair(){
  const r = await api('/pair', { method:'POST', body: JSON.stringify({ code: $('#pw').value, device_id: deviceId }) });
  if (r.ok) start(); else $('#pairMsg').textContent = T('authFail');
}
applyStaticI18n();
api('/api/me').then(r => { if (r.ok) start(); });

function start(){
  $('#pair').classList.add('hidden');
  $('#main').classList.remove('hidden');
  document.body.classList.toggle('theme-dark', theme === 'dark');
  if (EMBED) document.body.classList.add('embed');
  // 네이티브가 넘긴 하단 안전영역만큼 입력바 패딩(제스처바 위에 정확히 앉게)
  if (SAFE_BOTTOM > 0) $('#inputbar').style.paddingBottom = (10 + SAFE_BOTTOM) + 'px';
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  setupTerm();
  connect();
}

let fontSize = Math.min(22, Math.max(9, parseInt(localStorage.getItem('mtb_font') || '14', 10) || 14));
function setupTerm(){
  term = new Terminal({
    scrollback: 5000,
    fontSize: fontSize,
    lineHeight: 1.15,
    fontFamily: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace',
    theme: termTheme(),
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('#term'));
  doFit();
  term.onData(d => sendWs({ type:'input', sessionId: active, data: d }));
  term.onResize(({cols,rows}) => sendWs({ type:'resize', sessionId: active, cols, rows }));
  window.addEventListener('resize', applyViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyViewport);
    window.visualViewport.addEventListener('scroll', applyViewport);
  }
  $('#line').addEventListener('keydown', e => { if (e.key === 'Enter') sendLine(); });
  $('#send').addEventListener('click', () => { sendLine(); $('#line').focus(); });
  // 선택이 끝나면 자동으로 클립보드에 복사 (데스크톱 드래그·모바일 길게눌러 선택 모두)
  term.onSelectionChange(() => { const s = term.getSelection(); if (s) copyText(s); });
  // 위로 스크롤하면 '맨 아래로' 버튼 표시
  term.onScroll(updateToBottom);
  const tb = $('#toBottom');
  tb.addEventListener('click', () => { term.scrollToBottom(); updateToBottom(); });
  setupKeybar();
  setupSnippets();
  setupAttach();
  applyViewport();
  // 세로 = 직접 스크롤(scrollTop), 가로 = 세션 스와이프. Android WebView에서 확정 처리.
  let sx=0, sy=0, st=0, gmode=null, gtop=0; const t = $('#term');
  const termVp = () => t.querySelector('.xterm-viewport');
  t.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { gmode = 'multi'; return; }
    const k=e.changedTouches[0]; sx=k.clientX; sy=k.clientY; st=Date.now(); gmode=null;
    const vp = termVp(); gtop = vp ? vp.scrollTop : 0;
  }, {passive:true});
  t.addEventListener('touchmove', e => {
    if (gmode === 'multi' || e.touches.length !== 1) return;
    const k=e.touches[0], dx=k.clientX-sx, dy=k.clientY-sy;
    if (gmode === null) {
      if (Math.abs(dy) > 6 && Math.abs(dy) >= Math.abs(dx)) gmode='scroll';
      else if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) gmode='swipe';
    }
    if (gmode === 'scroll') {
      const vp = termVp();
      if (vp) { vp.scrollTop = gtop - dy; e.preventDefault(); updateToBottom(); }
    }
  }, {passive:false});
  t.addEventListener('touchend', e => {
    const k=e.changedTouches[0], dx=k.clientX-sx, dy=k.clientY-sy, dt=Date.now()-st;
    if (gmode !== 'scroll' && dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) switchByDelta(dx<0?1:-1);
    gmode = null;
  }, {passive:true});
  // 레이아웃이 안정된 뒤 다시 맞춰 첫 화면에서 상단이 가리는 문제 방지
  setTimeout(applyViewport, 250);
  setTimeout(applyViewport, 800);
}
function doFit(){ try { fit.fit(); } catch (e) {} }

function key(seq){ if (!sendWs({ type:'input', sessionId: active, data: seq })) { setConn(false); if (!ws || ws.readyState >= 2) connect(); } }
function sendLine(){
  const ln = $('#line');
  // 보낼 세션이 없거나 WS가 끊겼으면 입력을 비우지 않고 보존한다(조용히 사라지는 문제 방지).
  if (!active) { setConn(false); return; }
  const ok = sendWs({ type:'input', sessionId: active, data: ln.value + '\r' });
  if (ok) { ln.value = ''; }
  else {
    setConn(false);
    // 끊긴 소켓이면 즉시 재연결 시도 — 다음 전송이 통하도록.
    if (!ws || ws.readyState >= 2) connect();
  }
}
const KEYSEQ = { esc:'\x1b', tab:'\t', stab:'\x1b[Z', ctrlc:'\x03', up:'\x1b[A', down:'\x1b[B', left:'\x1b[D', right:'\x1b[C', enter:'\r' };

// ── 라이트/다크 테마 (기본 라이트 = Claude 크림 느낌) ──
let theme = localStorage.getItem('mtb_theme') || 'light';
function termTheme(){
  const cs = getComputedStyle(document.body);
  const bg = cs.getPropertyValue('--term-bg').trim() || '#faf9f5';
  const fg = cs.getPropertyValue('--term-fg').trim() || '#3d3d3a';
  return { background: bg, foreground: fg, cursor: '#cc785c', selectionBackground: '#cc785c55' };
}
function applyTheme(){
  document.body.classList.toggle('theme-dark', theme === 'dark');
  if (term) { try { term.options.theme = termTheme(); } catch (e) {} }
}
function toggleTheme(){ theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('mtb_theme', theme); applyTheme(); }

function copyText(text){
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) {}
}
function flashCopied(){
  const el = document.querySelector('#keybar .key[data-k="copy"]');
  if (!el) return; const prev = el.textContent;
  el.textContent = T('copied'); setTimeout(() => { el.textContent = prev; }, 900);
}

// ── 자주 쓰는 명령/프롬프트 저장 바 ──
let snippets = loadSnippets();
function loadSnippets(){
  try { const a = JSON.parse(localStorage.getItem('mtb_snippets') || 'null'); if (Array.isArray(a)) return a; } catch (e) {}
  return ['y', 'n', 'continue', '/compact'];
}
function saveSnippets(){ localStorage.setItem('mtb_snippets', JSON.stringify(snippets)); }
function delSnippet(i){ if (confirm(T('deletePrefix') + ': ' + snippets[i] + ' ?')) { snippets.splice(i, 1); saveSnippets(); renderSnippets(); } }
function renderSnippets(){
  const w = $('#snippets'); w.innerHTML = '';
  snippets.forEach((s, i) => {
    const c = document.createElement('div'); c.className = 'snip'; c.textContent = s;
    let timer;
    c.addEventListener('click', () => { const ln = $('#line'); ln.value = s; ln.focus(); });
    c.addEventListener('touchstart', () => { timer = setTimeout(() => delSnippet(i), 600); }, { passive: true });
    c.addEventListener('touchend', () => clearTimeout(timer), { passive: true });
    c.addEventListener('contextmenu', e => { e.preventDefault(); delSnippet(i); });
    w.appendChild(c);
  });
  const add = document.createElement('div'); add.className = 'snip add'; add.textContent = T('saveCurrent');
  add.addEventListener('click', () => {
    const v = $('#line').value.trim();
    if (v && snippets.indexOf(v) === -1) { snippets.push(v); saveSnippets(); renderSnippets(); }
  });
  w.appendChild(add);
}
function setupSnippets(){
  renderSnippets();
  $('#snipToggle').addEventListener('click', () => { $('#snippets').classList.toggle('show'); applyViewport(); });
}

// 📎 이미지/파일 첨부 → hub가 PC에 저장 → 경로를 입력칸에 삽입(Claude가 읽게)
function setupAttach(){
  const btn = $('#attach'), file = $('#attachFile');
  btn.addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    const f = file.files && file.files[0];
    file.value = '';
    if (!f) return;
    btn.classList.add('busy');
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f);
      });
      const r = await api('/upload', { method:'POST', body: JSON.stringify({ name: f.name, data: dataUrl }) });
      const j = await r.json();
      if (j && j.path) {
        const ln = $('#line');
        const sep = ln.value && !ln.value.endsWith(' ') ? ' ' : '';
        ln.value += sep + '"' + j.path + '" ';
        ln.focus();
      } else { alert(T('uploadFail')); }
    } catch (e) { alert(T('uploadFail') + ': ' + e); }
    btn.classList.remove('busy');
  });
}

function updateToBottom(){
  const tb = $('#toBottom'); if (!tb || !term) return;
  const b = term.buffer.active;
  const scrolledUp = b.viewportY < b.baseY - 1;
  tb.classList.toggle('show', scrolledUp);
}
function setFont(px){
  fontSize = Math.min(22, Math.max(9, px));
  localStorage.setItem('mtb_font', String(fontSize));
  try { term.options.fontSize = fontSize; } catch (e) {}
  doFit();
}
function setupKeybar(){
  document.querySelectorAll('#keybar .key').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (!k) return; // #snipToggle/#attach는 자체 리스너로 처리
    if (k === 'copy') {
      const s = term.getSelection();
      if (s) { copyText(s); flashCopied(); }
      return;
    }
    if (k === 'fdec') { setFont(fontSize - 1); return; }
    if (k === 'finc') { setFont(fontSize + 1); return; }
    if (k === 'theme') { toggleTheme(); return; }
    key(KEYSEQ[k]);
  }));
}
function applyViewport(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const app = document.getElementById('app');
  if (app) app.style.height = h + 'px';
  doFit();
}

function setConn(ok){ const b = $('#send'); if (b) b.classList.toggle('offline', !ok); }
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen = () => { setConn(true); doFit(); };
  ws.onclose = () => { setConn(false); setTimeout(connect, 1500); };
  ws.onerror = () => setConn(false);
  ws.onmessage = e => handle(JSON.parse(e.data));
}
// 전송 성공 여부를 반환 — WS가 안 열렸으면 false(메시지는 버려짐).
function sendWs(m){ if (ws && ws.readyState === 1) { ws.send(JSON.stringify(m)); return true; } return false; }

function handle(m){
  if (m.type === 'session_list') {
    sessions = m.sessions;
    if (WANT_SESSION && sessions.find(s => s.id === WANT_SESSION) && active !== WANT_SESSION) {
      active = WANT_SESSION;
      sendWs({ type: 'select', sessionId: active });
    } else if ((!active || !sessions.find(s => s.id === active))) {
      active = sessions[0] ? sessions[0].id : '';
    }
    renderBar();
  } else if (m.type === 'terminal_data') {
    if (m.sessionId === active) term.write(m.data);
  } else if (m.type === 'notify') {
    notify(m);
  }
}

function notify(m){
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
  // 활성 세션이 화면에 보이는 동안엔 시끄럽지 않게 — 백그라운드거나 다른 세션일 때만 알림
  if (!document.hidden && m.sessionId === active) return;
  const s = sessions.find(x => x.id === m.sessionId);
  const label = (s && s.label) || m.label || T('session');
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('MTB: ' + label, { body: T('doneWaiting'), tag: 'mtb-' + m.sessionId });
    }
  } catch (e) {}
}

function renderBar(){
  const bar = $('#bar'); bar.innerHTML = '';
  let activeEl = null;
  for (const s of sessions) {
    const c = document.createElement('div');
    c.className = 'chip' + (s.id === active ? ' active' : '');
    c.title = s.label;
    c.onclick = () => switchTo(s.id);

    const lbl = document.createElement('span');
    lbl.className = 'chip-lbl';
    lbl.textContent = s.label;
    c.appendChild(lbl);

    const closeBtn = document.createElement('span');
    closeBtn.className = 'chip-close';
    closeBtn.textContent = '×';
    closeBtn.title = T('delete') || 'Delete';
    closeBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm((T('deletePrefix') || 'Delete') + ': ' + s.label + ' ?')) return;
      await api('/sessions/close', { method:'POST', body: JSON.stringify({ id: s.id }) });
    };
    c.appendChild(closeBtn);

    bar.appendChild(c);
    if (s.id === active) activeEl = c;
  }
  const plus = document.createElement('div'); plus.id = 'plus'; plus.textContent = '+';
  plus.onclick = openNewSession; bar.appendChild(plus);
  // 새/활성 칩이 화면 밖으로 밀리면 보이도록 스크롤
  if (activeEl) { try { activeEl.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}
function switchTo(id){
  if (id === active) return;
  active = id; term.reset();
  sendWs({ type:'select', sessionId: id });
  renderBar(); doFit();
}
function switchByDelta(d){
  const i = sessions.findIndex(s => s.id === active);
  const n = sessions[i + d];
  if (n) switchTo(n.id);
}

async function openNewSession(){
  const { projects } = await (await api('/projects')).json();
  const sheet = $('#sheet');
  sheet.innerHTML = '<h3>' + escapeHtml(T('newSessionPick')) + '</h3>';
  for (const p of projects) {
    const row = document.createElement('div'); row.className = 'row row-fav';
    const lbl = document.createElement('span'); lbl.className = 'fav-label'; lbl.textContent = '▶ ' + p.label;
    lbl.onclick = () => createSession(p.path);
    const del = document.createElement('span'); del.className = 'fav-del'; del.textContent = '×'; del.title = T('delete') || 'delete';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm((T('deletePrefix') || 'Delete') + ': ' + p.label + ' ?')) return;
      await api('/projects/remove', { method:'POST', body: JSON.stringify({ path: p.path }) });
      openNewSession();
    };
    row.appendChild(lbl); row.appendChild(del);
    sheet.appendChild(row);
  }
  const actions = document.createElement('div'); actions.className = 'sheet-actions';
  const browse = document.createElement('button'); browse.className = 'btn'; browse.textContent = T('browseFolder');
  browse.onclick = () => browseFrom(null); actions.appendChild(browse);
  const close = document.createElement('button'); close.className = 'btn ghost'; close.textContent = T('close');
  close.onclick = () => $('#modal').classList.remove('show'); actions.appendChild(close);
  sheet.appendChild(actions);
  $('#modal').classList.add('show');
}
async function browseFrom(p){
  const { entries, cwd } = await (await api('/fs' + (p ? ('?path=' + encodeURIComponent(p)) : ''))).json();
  const sheet = $('#sheet');
  sheet.innerHTML = '<h3>' + (cwd ? escapeHtml(cwd) : escapeHtml(T('drives'))) + '</h3>';
  if (cwd) {
    const up = document.createElement('div'); up.className = 'row'; up.textContent = T('up');
    up.onclick = () => browseFrom(parentOf(cwd)); sheet.appendChild(up);
  }
  for (const e of entries) {
    const row = document.createElement('div'); row.className = 'row';
    row.textContent = '📁 ' + e.name; row.onclick = () => browseFrom(e.path);
    sheet.appendChild(row);
  }
  const actions = document.createElement('div'); actions.className = 'sheet-actions';
  if (cwd) {
    const here = document.createElement('button'); here.className = 'btn'; here.textContent = T('startHere');
    here.onclick = () => addAndCreate(cwd); actions.appendChild(here);
    const mk = document.createElement('button'); mk.className = 'btn ghost'; mk.textContent = T('newFolder');
    mk.onclick = () => newFolder(cwd); actions.appendChild(mk);
  }
  const close = document.createElement('button'); close.className = 'btn ghost'; close.textContent = T('close');
  close.onclick = () => $('#modal').classList.remove('show'); actions.appendChild(close);
  sheet.appendChild(actions);
}
async function newFolder(parent){
  const name = prompt(T('newFolderPrompt'));
  if (!name) return;
  const r = await api('/fs/mkdir', { method:'POST', body: JSON.stringify({ parent, name }) });
  const j = await r.json().catch(() => ({}));
  if (j && j.path) addAndCreate(j.path); else alert(T('mkdirFail'));
}
function parentOf(p){ const i = Math.max(p.lastIndexOf('\\'), p.lastIndexOf('/')); return i > 2 ? p.slice(0, i) : null; }
async function addAndCreate(p){
  const label = p.split(/[\\/]/).filter(Boolean).pop() || p;
  await api('/projects/add', { method:'POST', body: JSON.stringify({ label, path: p }) });
  createSession(p);
}
async function createSession(p){
  $('#modal').classList.remove('show');
  const r = await api('/sessions/create', { method:'POST', body: JSON.stringify({ path: p }) });
  try { const j = await r.json(); if (j && j.id) { active = j.id; term.reset(); renderBar(); focusTerminal(); } } catch (e) {}
}
// 새 세션/전환 시 수동 탭 없이도 키보드+레이아웃이 잡히게: 입력칸 포커스(키보드) → 뷰포트 재맞춤.
function focusTerminal(){
  setTimeout(() => {
    try { $('#line').focus(); } catch (e) {}
    applyViewport();
    setTimeout(applyViewport, 350);
  }, 200);
}
window.__mtbNew = openNewSession;
</script>
</body>
