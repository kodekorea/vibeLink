<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MTB Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0b0b;color:#ddd;font-family:sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #pair{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%}
  #pair input{font-size:18px;padding:10px;width:220px;text-align:center}
  .btn,#pairBtn{font-size:16px;padding:10px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px}
  #main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  #bar{display:flex;gap:6px;padding:6px;padding-top:calc(6px + env(safe-area-inset-top));overflow-x:auto;background:#151515;align-items:center;flex:0 0 auto}
  .chip{padding:6px 12px;background:#222;border-radius:16px;white-space:nowrap;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
  .chip.active{background:#2563eb}
  #plus{padding:6px 12px;background:#333;border-radius:16px;font-size:18px}
  #term{flex:1 1 auto;min-height:0;position:relative}
  #term .xterm-viewport{overflow-y:auto !important;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
  #toBottom{position:absolute;right:12px;bottom:12px;z-index:5;display:none;width:42px;height:42px;border-radius:21px;background:#2563eb;color:#fff;border:none;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  #toBottom.show{display:block}
  #keybar{display:flex;gap:6px;padding:6px;background:#101010;overflow-x:auto;flex:0 0 auto}
  .key{flex:0 0 auto;min-width:46px;padding:9px 10px;background:#262626;color:#eee;border:1px solid #333;border-radius:6px;font-size:15px;text-align:center;user-select:none;-webkit-user-select:none}
  .key:active{background:#2563eb}
  #snippets{display:none;gap:6px;padding:6px;background:#0d0d0d;overflow-x:auto;flex:0 0 auto;border-top:1px solid #1a1a1a}
  #snippets.show{display:flex}
  .snip{flex:0 0 auto;padding:8px 12px;background:#1e293b;color:#cbd5e1;border-radius:14px;font-size:14px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .snip.add{background:#333;color:#fff}
  #inputbar{display:flex;gap:6px;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom));background:#151515;flex:0 0 auto}
  #inputbar input{flex:1;font-size:16px;padding:8px;background:#000;color:#eee;border:1px solid #333;border-radius:6px}
  #snipToggle{flex:0 0 auto;padding:8px 11px;background:#262626;color:#eee;border:1px solid #333;border-radius:6px;font-size:16px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10}
  #modal.show{display:flex}
  #sheet{background:#1a1a1a;width:90%;max-width:420px;max-height:80%;overflow:auto;border-radius:10px;padding:14px}
  .row{padding:10px;border-bottom:1px solid #2a2a2a;cursor:pointer}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <div id="pair">
    <h2>MTB Hub</h2>
    <input id="pw" type="password" placeholder="암호" autocomplete="off">
    <button id="pairBtn">연결</button>
    <div id="pairMsg" style="color:#f66;font-size:13px"></div>
  </div>
  <div id="main" class="hidden">
    <div id="bar"></div>
    <div id="term"><button id="toBottom" title="맨 아래로">⤓</button></div>
    <div id="keybar">
      <div class="key" data-k="esc">Esc</div>
      <div class="key" data-k="tab">Tab</div>
      <div class="key" data-k="ctrlc">^C</div>
      <div class="key" data-k="up">↑</div>
      <div class="key" data-k="down">↓</div>
      <div class="key" data-k="left">←</div>
      <div class="key" data-k="right">→</div>
      <div class="key" data-k="enter">⏎</div>
      <div class="key" data-k="copy">복사</div>
      <div class="key" data-k="fdec">A−</div>
      <div class="key" data-k="finc">A+</div>
    </div>
    <div id="snippets"></div>
    <div id="inputbar">
      <button id="snipToggle" title="자주 쓰는 명령">★</button>
      <input id="line" placeholder="명령 입력 후 Enter" autocomplete="off" autocapitalize="off">
    </div>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const deviceId = (() => {
  let id = localStorage.getItem('mtb_device');
  if (!id) { id = 'dev-' + Math.random().toString(36).slice(2); localStorage.setItem('mtb_device', id); }
  return id;
})();
const $ = s => document.querySelector(s);
let ws, term, fit, sessions = [], active = '';

function api(p, opts){ return fetch(p, Object.assign({ headers:{ 'Content-Type':'application/json' } }, opts)); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#pairBtn').onclick = pair;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') pair(); });
async function pair(){
  const r = await api('/pair', { method:'POST', body: JSON.stringify({ code: $('#pw').value, device_id: deviceId }) });
  if (r.ok) start(); else $('#pairMsg').textContent = '인증 실패';
}
api('/api/me').then(r => { if (r.ok) start(); });

function start(){
  $('#pair').classList.add('hidden');
  $('#main').classList.remove('hidden');
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  setupTerm();
  connect();
}

let fontSize = Math.min(22, Math.max(9, parseInt(localStorage.getItem('mtb_font') || '14', 10) || 14));
function setupTerm(){
  term = new Terminal({
    scrollback: 5000,
    fontSize: fontSize,
    lineHeight: 1.15,
    fontFamily: 'ui-monospace, Menlo, Consolas, "Roboto Mono", monospace',
    theme: { background:'#0b0b0b', foreground:'#e6e6e6', cursor:'#2563eb', selectionBackground:'#2563eb66' },
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('#term'));
  doFit();
  term.onData(d => sendWs({ type:'input', sessionId: active, data: d }));
  term.onResize(({cols,rows}) => sendWs({ type:'resize', sessionId: active, cols, rows }));
  window.addEventListener('resize', applyViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyViewport);
    window.visualViewport.addEventListener('scroll', applyViewport);
  }
  $('#line').addEventListener('keydown', e => {
    if (e.key === 'Enter') { sendWs({ type:'input', sessionId: active, data: $('#line').value + '\r' }); $('#line').value=''; }
  });
  // 선택이 끝나면 자동으로 클립보드에 복사 (데스크톱 드래그·모바일 길게눌러 선택 모두)
  term.onSelectionChange(() => { const s = term.getSelection(); if (s) copyText(s); });
  // 위로 스크롤하면 '맨 아래로' 버튼 표시
  term.onScroll(updateToBottom);
  const tb = $('#toBottom');
  tb.addEventListener('click', () => { term.scrollToBottom(); updateToBottom(); });
  setupKeybar();
  setupSnippets();
  applyViewport();
  let sx=0, sy=0, st=0; const t = $('#term');
  t.addEventListener('touchstart', e => { const k=e.changedTouches[0]; sx=k.clientX; sy=k.clientY; st=Date.now(); }, {passive:true});
  t.addEventListener('touchend', e => {
    const k=e.changedTouches[0], dx=k.clientX-sx, dy=k.clientY-sy, dt=Date.now()-st;
    if (dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) switchByDelta(dx<0?1:-1);
  }, {passive:true});
  // 레이아웃이 안정된 뒤 다시 맞춰 첫 화면에서 상단이 가리는 문제 방지
  setTimeout(applyViewport, 250);
  setTimeout(applyViewport, 800);
}
function doFit(){ try { fit.fit(); } catch (e) {} }

function key(seq){ sendWs({ type:'input', sessionId: active, data: seq }); }
const KEYSEQ = { esc:'\x1b', tab:'\t', ctrlc:'\x03', up:'\x1b[A', down:'\x1b[B', left:'\x1b[D', right:'\x1b[C', enter:'\r' };

function copyText(text){
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) {}
}
function flashCopied(){
  const el = document.querySelector('#keybar .key[data-k="copy"]');
  if (!el) return; const prev = el.textContent;
  el.textContent = '복사됨'; setTimeout(() => { el.textContent = prev; }, 900);
}

// ── 자주 쓰는 명령/프롬프트 저장 바 ──
let snippets = loadSnippets();
function loadSnippets(){
  try { const a = JSON.parse(localStorage.getItem('mtb_snippets') || 'null'); if (Array.isArray(a)) return a; } catch (e) {}
  return ['y', 'n', '계속 진행해줘', '/compact'];
}
function saveSnippets(){ localStorage.setItem('mtb_snippets', JSON.stringify(snippets)); }
function delSnippet(i){ if (confirm('삭제: ' + snippets[i] + ' ?')) { snippets.splice(i, 1); saveSnippets(); renderSnippets(); } }
function renderSnippets(){
  const w = $('#snippets'); w.innerHTML = '';
  snippets.forEach((s, i) => {
    const c = document.createElement('div'); c.className = 'snip'; c.textContent = s;
    let timer;
    c.addEventListener('click', () => { const ln = $('#line'); ln.value = s; ln.focus(); });
    c.addEventListener('touchstart', () => { timer = setTimeout(() => delSnippet(i), 600); }, { passive: true });
    c.addEventListener('touchend', () => clearTimeout(timer), { passive: true });
    c.addEventListener('contextmenu', e => { e.preventDefault(); delSnippet(i); });
    w.appendChild(c);
  });
  const add = document.createElement('div'); add.className = 'snip add'; add.textContent = '＋ 현재 입력 저장';
  add.addEventListener('click', () => {
    const v = $('#line').value.trim();
    if (v && snippets.indexOf(v) === -1) { snippets.push(v); saveSnippets(); renderSnippets(); }
  });
  w.appendChild(add);
}
function setupSnippets(){
  renderSnippets();
  $('#snipToggle').addEventListener('click', () => { $('#snippets').classList.toggle('show'); applyViewport(); });
}

function updateToBottom(){
  const tb = $('#toBottom'); if (!tb || !term) return;
  const b = term.buffer.active;
  const scrolledUp = b.viewportY < b.baseY - 1;
  tb.classList.toggle('show', scrolledUp);
}
function setFont(px){
  fontSize = Math.min(22, Math.max(9, px));
  localStorage.setItem('mtb_font', String(fontSize));
  try { term.options.fontSize = fontSize; } catch (e) {}
  doFit();
}
function setupKeybar(){
  document.querySelectorAll('#keybar .key').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (k === 'copy') {
      const s = term.getSelection();
      if (s) { copyText(s); flashCopied(); }
      return;
    }
    if (k === 'fdec') { setFont(fontSize - 1); return; }
    if (k === 'finc') { setFont(fontSize + 1); return; }
    key(KEYSEQ[k]);
  }));
}
function applyViewport(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const app = document.getElementById('app');
  if (app) app.style.height = h + 'px';
  doFit();
}

function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen = () => doFit();
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function sendWs(m){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function handle(m){
  if (m.type === 'session_list') {
    sessions = m.sessions;
    if ((!active || !sessions.find(s => s.id === active))) active = sessions[0] ? sessions[0].id : '';
    renderBar();
  } else if (m.type === 'terminal_data') {
    if (m.sessionId === active) term.write(m.data);
  } else if (m.type === 'notify') {
    notify(m);
  }
}

function notify(m){
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
  // 활성 세션이 화면에 보이는 동안엔 시끄럽지 않게 — 백그라운드거나 다른 세션일 때만 알림
  if (!document.hidden && m.sessionId === active) return;
  const s = sessions.find(x => x.id === m.sessionId);
  const label = (s && s.label) || m.label || '세션';
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('MTB: ' + label, { body: '완료 / 입력 대기', tag: 'mtb-' + m.sessionId });
    }
  } catch (e) {}
}

function renderBar(){
  const bar = $('#bar'); bar.innerHTML = '';
  let activeEl = null;
  for (const s of sessions) {
    const c = document.createElement('div');
    c.className = 'chip' + (s.id === active ? ' active' : '');
    c.textContent = s.label;
    c.title = s.label;
    c.onclick = () => switchTo(s.id);
    bar.appendChild(c);
    if (s.id === active) activeEl = c;
  }
  const plus = document.createElement('div'); plus.id = 'plus'; plus.textContent = '+';
  plus.onclick = openNewSession; bar.appendChild(plus);
  // 새/활성 칩이 화면 밖으로 밀리면 보이도록 스크롤
  if (activeEl) { try { activeEl.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}
function switchTo(id){
  if (id === active) return;
  active = id; term.reset();
  sendWs({ type:'select', sessionId: id });
  renderBar(); doFit();
}
function switchByDelta(d){
  const i = sessions.findIndex(s => s.id === active);
  const n = sessions[i + d];
  if (n) switchTo(n.id);
}

async function openNewSession(){
  const { projects } = await (await api('/projects')).json();
  const sheet = $('#sheet');
  sheet.innerHTML = '<h3>새 세션 — 프로젝트 선택</h3>';
  for (const p of projects) {
    const row = document.createElement('div'); row.className = 'row';
    row.textContent = '▶ ' + p.label;
    row.onclick = () => createSession(p.path);
    sheet.appendChild(row);
  }
  const browse = document.createElement('button'); browse.className = 'btn'; browse.textContent = '폴더 찾아보기';
  browse.style.marginTop = '10px'; browse.onclick = () => browseFrom(null); sheet.appendChild(browse);
  const close = document.createElement('button'); close.textContent = '닫기'; close.style.marginLeft = '8px';
  close.onclick = () => $('#modal').classList.remove('show'); sheet.appendChild(close);
  $('#modal').classList.add('show');
}
async function browseFrom(p){
  const { entries, cwd } = await (await api('/fs' + (p ? ('?path=' + encodeURIComponent(p)) : ''))).json();
  const sheet = $('#sheet');
  sheet.innerHTML = '<h3>' + (cwd ? escapeHtml(cwd) : '드라이브') + '</h3>';
  if (cwd) {
    const up = document.createElement('div'); up.className = 'row'; up.textContent = '⬆ 상위';
    up.onclick = () => browseFrom(parentOf(cwd)); sheet.appendChild(up);
    const here = document.createElement('button'); here.className = 'btn'; here.textContent = '여기서 세션 시작';
    here.onclick = () => addAndCreate(cwd); sheet.appendChild(here);
  }
  for (const e of entries) {
    const row = document.createElement('div'); row.className = 'row';
    row.textContent = '📁 ' + e.name; row.onclick = () => browseFrom(e.path);
    sheet.appendChild(row);
  }
}
function parentOf(p){ const i = Math.max(p.lastIndexOf('\\'), p.lastIndexOf('/')); return i > 2 ? p.slice(0, i) : null; }
async function addAndCreate(p){
  const label = p.split(/[\\/]/).filter(Boolean).pop() || p;
  await api('/projects/add', { method:'POST', body: JSON.stringify({ label, path: p }) });
  createSession(p);
}
async function createSession(p){
  $('#modal').classList.remove('show');
  const r = await api('/sessions/create', { method:'POST', body: JSON.stringify({ path: p }) });
  try { const j = await r.json(); if (j && j.id) { active = j.id; term.reset(); renderBar(); } } catch (e) {}
}
</script>
</body>
</html>
