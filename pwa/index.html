<!doctype html>
<!-- 휴대폰 PWA — 페어링 + 영상 (auto-refresh) + 입력 박스 + push 수신 셸. -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>mobile_term_bridge</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="/lib/tesseract.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .card { background: #1c1c1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; opacity: 0.8; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], select { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #000; color: #eee; font-size: 1.1rem; }
    #code { font-size: 1.1rem; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; margin-top: 8px; cursor: pointer; }
    button.secondary { background: #444; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .qr-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .qr-groups { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
    .qr-group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding: 4px 0 4px 8px; border-left: 3px solid #444; }
    .qr-group[data-group="nav"]   { border-left-color: #0ea5e9; }
    .qr-group[data-group="resp"]  { border-left-color: #6b7280; }
    .qr-group[data-group="key"]   { border-left-color: #3b82f6; }
    .qr-group[data-group="macro"] { border-left-color: #16a34a; }
    .qr-label { color: #888; font-size: 0.7rem; min-width: 44px; padding-right: 6px; font-weight: 600; letter-spacing: 0.5px; }
    .folder-buttons { display: contents; }
    .tab-state { font-size: 0.78rem; color: #94a3b8; padding: 4px 6px; min-height: 1.2em; cursor: pointer; user-select: none; }
    .tab-state:empty::before { content: '탭 (미추적 — 폴더 단추로 시작)'; opacity: 0.4; }
    body.fs .tab-state { font-size: 0.72rem; padding: 2px 6px; }
    body.fs .qr-group { padding: 2px 0 2px 6px; }
    body.fs .qr-label { font-size: 0.65rem; min-width: 38px; padding-right: 4px; }
    button.qr { padding: 8px 14px; font-size: 0.95rem; background: #1c1c1e; border: 1px solid #444; color: #eee; border-radius: 8px; cursor: pointer; width: auto; margin: 0; font-weight: bold; }
    button.qr:active, button.qr:hover { background: #2563eb; border-color: #2563eb; }
    button.qr.danger { background: #3a1a1a; border-color: #5a2a2a; }
    button.qr.danger:active, button.qr.danger:hover { background: #dc2626; border-color: #dc2626; }
    button.qr.phrase { background: #1e293b; border-color: #3b4d63; }
    button.qr.phrase:active, button.qr.phrase:hover { background: #0ea5e9; border-color: #0ea5e9; }
    button.qr.cp { background: #1a2e1a; border-color: #2e4a2e; }
    button.qr.cp:active, button.qr.cp:hover { background: #16a34a; border-color: #16a34a; }
    /* 전체화면 전용 — 입력창 위 quick-reply (선택 가능한 사이즈) */
    body.fs .qr-row { margin: 0 0 6px 0; gap: 5px; }
    body.fs .qr-groups { margin: 0 0 6px 0; gap: 1px; }
    body.fs button.qr { padding: 8px 12px; font-size: 0.9rem; border-radius: 6px; min-width: 42px; }
    .status { font-size: 0.85rem; opacity: 0.7; padding: 8px 0; min-height: 1.4em; }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .status.busy { color: #eab308; animation: mtb-pulse 1s ease-in-out infinite; opacity: 1; }
    @keyframes mtb-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    img#screen { width: 100%; height: auto; border-radius: 8px; background: #000; display: block; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
    .cap-wrap { position: relative; overflow: auto; -webkit-overflow-scrolling: touch; max-height: 70vh; }
    /* 영역 설정 오버레이 — 이미지 위 절대 위치, 평소 pointer-events:none (이미지 클릭 통과) */
    #crop-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
    #crop-overlay.active { pointer-events: auto; background: rgba(0, 0, 0, 0.3); cursor: crosshair; touch-action: none; }
    #crop-rect { position: absolute; border: 1px dashed #4ade80; background: rgba(74, 222, 128, 0.08); display: none; pointer-events: none; }
    .row { display: flex; gap: 8px; }
    .row > button { flex: 1; margin-top: 0; }
    .small { font-size: 0.75rem; opacity: 0.6; }

    /* 탭 */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { background: #1c1c1e; flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; opacity: 0.6; border: 0; color: #eee; margin-top: 0; }
    .tab-btn.active { opacity: 1; background: #2563eb; }

    /* OCR 전용 탭 — 캡처 이미지 + 블록별 인라인 편집 */
    #view-ocr { display: none; flex-direction: column; gap: 8px; }
    body.ocr-tab #view-ocr { display: flex; }
    body.ocr-tab #view-normal, body.ocr-tab #view-fs { display: none; }
    body.ocr-tab .qr-row, body.ocr-tab .qr-groups, body.ocr-tab #input-status { display: none; }
    #ocr-img-wrap { background: #000; border-radius: 8px; max-height: 35vh; overflow: auto; text-align: center; }
    #ocr-img-wrap img { max-width: 100%; display: block; margin: 0 auto; }
    #ocr-meta { font-size: 0.8rem; opacity: 0.7; padding: 4px 2px; }
    #ocr-blocks-list { background: #1c1c1e; border-radius: 8px; padding: 4px; flex: 1; overflow-y: auto; }
    .ocr-block { display: flex; align-items: stretch; padding: 6px; border-bottom: 1px solid #2a2a2a; gap: 8px; }
    .ocr-block .block-run { width: 52px; padding: 6px; margin: 0; font-size: 0.95rem; background: #2563eb; flex-shrink: 0; align-self: center; }
    .ocr-block .block-del { width: 36px; padding: 6px; margin: 0; font-size: 0.95rem; background: #6b1818; flex-shrink: 0; align-self: center; }
    .ocr-block code { flex: 1; font-family: ui-monospace, monospace; font-size: 0.88rem; color: #ddd; word-break: break-all; white-space: pre-wrap; padding: 6px 8px; background: #0a0a0a; border-radius: 4px; min-height: 1.4em; -webkit-user-modify: read-write-plaintext-only; }
    .ocr-block code[contenteditable]:focus { outline: 2px solid #2563eb; background: #0f1620; }
    .ocr-action-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .ocr-action-bar button { flex: 1; padding: 10px; margin: 0; width: auto; min-width: 80px; }
    /* 전체화면 뷰 — 영상 최대 + 입력만 */
    #view-fs { display: none; }
    body.fs { padding: 0; max-width: none; }
    body.fs h1, body.fs #pair-card, body.fs #view-normal { display: none; }
    body.fs #view-fs { display: flex; flex-direction: column; height: 100vh; }
    body.fs #fs-img { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
    body.fs #fs-bar { padding: 8px; background: #1c1c1e; display: flex; flex-direction: column; gap: 6px; }
    body.fs #fs-input {
      width: 100%; padding: 10px; border-radius: 8px;
      background: #000; color: #eee; border: 1px solid #333;
      font-size: 1rem; font-family: -apple-system, ui-monospace, monospace;
      resize: vertical; min-height: 60px; max-height: 200px;
      overflow-y: auto;
    }
    body.fs .fs-buttons { display: flex; gap: 6px; }
    body.fs .fs-buttons button { padding: 8px 12px; margin: 0; font-size: 0.9rem; width: auto; }
    body.fs #fs-send { flex: 1; }
    body.fs .tabs { display: none; }
  </style>
</head>
<body>
  <h1>mobile_term_bridge</h1>

  <section id="pair-card" class="card">
    <label for="code">PC 의 실행.bat 에 설정한 암호 (또는 발급된 6자리 코드)</label>
    <input id="code" type="password" placeholder="암호 또는 코드" autocomplete="current-password" />
    <button id="pair-btn" type="button">페어링</button>
    <div id="pair-status" class="status"></div>
  </section>

  <div class="tabs" id="tabs" hidden>
    <button id="tab-normal" type="button" class="tab-btn active">표준</button>
    <button id="tab-fs" type="button" class="tab-btn">전체 화면</button>
    <button id="tab-ocr" type="button" class="tab-btn">📝 OCR</button>
  </div>

  <section id="main-card" class="card" hidden>
    <div id="view-normal">
    <label>창 선택</label>
    <select id="target"><option value="">(목록 새로고침 후 선택)</option></select>
    <div class="row" style="margin-top: 8px;">
      <button id="list-btn" type="button" class="secondary">목록 새로고침</button>
      <button id="refresh-btn" type="button" class="secondary">캡처</button>
      <button id="auto-btn" type="button" class="secondary">자동(2fps)</button>
    </div>
    <div id="cap-status" class="status"></div>
    <div class="cap-wrap">
      <img id="screen" alt="terminal capture" />
      <div id="crop-overlay"><div id="crop-rect"></div></div>
    </div>
    <div class="row" style="margin-top: 8px;">
      <button id="crop-set-btn" type="button" class="secondary">영역 설정</button>
      <button id="crop-reset-btn" type="button" class="secondary">영역 초기화</button>
    </div>
    <div class="row" style="margin-top: 4px;" id="ocr-crop-row" hidden>
      <button id="ocr-crop-set-btn" type="button" class="secondary" title="OCR 전용 영역 — 화면 crop 과 독립">📝 OCR영역 설정</button>
      <button id="ocr-crop-reset-btn" type="button" class="secondary">📝 OCR영역 초기화</button>
    </div>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
      <label style="font-size: 0.8rem; opacity: 0.8; margin: 0;">줌</label>
      <input id="zoom-slider" type="range" min="100" max="400" value="100" style="flex: 1;" />
      <span id="zoom-val" style="font-size: 0.85rem; opacity: 0.8; min-width: 3em; text-align: right;">100%</span>
    </div>
    <div id="crop-status" class="status"></div>
    <div style="margin-top: 12px;">
      <label for="input-text">입력 (Enter 키는 별도 버튼)</label>
      <div style="display: flex; gap: 6px; align-items: stretch;">
        <input id="input-text" type="text" placeholder="명령 입력..." style="flex: 1;" />
        <button id="voice-btn" type="button" class="secondary" title="음성 입력 (ko-KR)" style="width: auto; padding: 0 12px; margin: 0; font-size: 1.2rem;">🎤</button>
      </div>
      <div style="margin-top: 8px; font-size: 0.85rem; opacity: 0.8;">
        <label style="display: inline; opacity: 1;">
          <input type="checkbox" id="method-sendinput" /> Electron 모드 (foreground SendInput — Antigravity 용)
        </label>
        <label style="display: inline; opacity: 1; margin-left: 12px;">
          <input type="checkbox" id="auto-end-toggle" checked /> 송신 전 자동 ⇲ End (스크롤 다운)
        </label>
      </div>
      <div class="row" style="margin-top: 8px;">
        <button id="send-btn" type="button">전송</button>
        <button id="send-enter-btn" type="button">전송 + Enter</button>
        <button id="enter-only-btn" type="button" class="secondary">Enter</button>
      </div>
      <div class="qr-row" id="qr-row-cp-main">
        <button class="qr cp" id="copy-btn">📋 복사+전환</button>
        <button class="qr cp" id="paste-btn">📥 붙여넣기</button>
        <button class="qr" id="ocr-btn" title="현재 캡처 이미지의 텍스트 추출 (한+영)">📝 OCR</button>
      </div>
      <div class="tab-state" id="tab-state-main" title="현재 추정 탭 — 클릭해서 보정"></div>
      <div class="qr-groups" id="qr-row-main">
        <div class="qr-group" data-group="nav">
          <small class="qr-label">이동</small>
          <button class="qr" data-vk="38" title="↑ 위 (히스토리 이전)">↑</button>
          <button class="qr" data-vk="40" title="↓ 아래 (히스토리 다음)">↓</button>
          <button class="qr" data-vk="37" title="← 커서 왼쪽">←</button>
          <button class="qr" data-vk="39" title="→ 커서 오른쪽">→</button>
          <button class="qr" data-vk="37" data-mods="17,18" data-tab-shift="-1" title="이전 터미널 탭 (Ctrl+Alt+← — Antigravity keybindings 사전 설정 필요)">⬅️탭</button>
          <button class="qr" data-vk="39" data-mods="17,18" data-tab-shift="1" title="다음 터미널 탭 (Ctrl+Alt+→ — Antigravity keybindings 사전 설정 필요)">탭➡️</button>
        </div>
        <div class="qr-group" data-group="resp">
          <small class="qr-label">응답</small>
          <button class="qr" data-text="y" data-enter="true">y</button>
          <button class="qr" data-text="n" data-enter="true">n</button>
          <button class="qr" data-text="1" data-enter="true">1</button>
          <button class="qr" data-text="2" data-enter="true">2</button>
          <button class="qr" data-text="3" data-enter="true">3</button>
          <button class="qr" data-text="4" data-enter="true">4</button>
          <button class="qr" data-text="5" data-enter="true">5</button>
          <button class="qr" data-text="111" data-enter="true">111</button>
          <button class="qr danger" data-vk="27">Esc</button>
          <button class="qr danger" data-vk="67" data-mods="17" title="현재 명령 인터럽트 (Ctrl+C)">⛔Ctrl+C</button>
        </div>
        <div class="qr-group" data-group="key">
          <small class="qr-label">키</small>
          <button class="qr" data-vk="33" title="PageUp — 터미널 스크롤백 위로">⇈</button>
          <button class="qr" data-vk="34" title="PageDown — 터미널 스크롤백 아래로">⇊</button>
          <button class="qr" data-vk="36" title="Home — 맨 위로">⇱</button>
          <button class="qr" data-vk="35" title="End — 맨 아래로">⇲</button>
          <button class="qr" data-vk="192" data-mods="17,16" data-tab-new="1" title="새 터미널 (Ctrl+Shift+`) — 현재 활성 폴더 기준">➕새창</button>
          <button class="qr" data-vk="53" data-mods="17,16" data-tab-new="1" title="터미널 스플릿 (Ctrl+Shift+5)">➗분할</button>
          <button class="qr" data-vk="9" data-mods="16" data-repeat="1" title="Claude Code 권한모드 전환 (Shift+Tab × 1)">🔓권한</button>
          <button class="qr folder-manage" type="button" title="폴더 등록·삭제">⚙️폴더</button>
          <span class="folder-buttons" data-fs="0"></span>
        </div>
        <div class="qr-group" data-group="macro">
          <small class="qr-label">매크로</small>
          <button class="qr phrase" data-text="맞아 진행해" data-enter="true">진행</button>
          <button class="qr phrase" data-text="다음 무슨 작업하면 좋을까?" data-enter="true">🤔추천</button>
          <button class="qr phrase" data-text="메모리 갱신해줘" data-enter="true">메모리</button>
          <button class="qr phrase" data-text="오늘 종료해" data-enter="true">종료</button>
          <button class="qr phrase" data-text="커밋하고 푸시해줘" data-enter="true">💾커밋</button>
          <button class="qr phrase" data-text="문제가 계속 발생하는데 왜 그런지 경우의수 파악해줘" data-enter="true">분석</button>
        </div>
      </div>
      <div id="input-status" class="status"></div>
    </div>
    <p class="small" style="margin-top: 16px;">자동 입력 정책: push 알림 클릭 시 PWA 가 열리기만 함 - 본인이 직접 입력해야 명령 송신.</p>
    </div>

    <div id="view-fs">
      <img id="fs-img" alt="terminal capture (fullscreen)" />
      <div id="fs-bar">
        <div class="qr-row" id="qr-row-cp-fs">
          <button class="qr fs-qr cp" id="fs-copy-btn">📋 복사+전환</button>
          <button class="qr fs-qr cp" id="fs-paste-btn">📥 붙여넣기</button>
          <button class="qr fs-qr" id="fs-ocr-btn" title="화면에서 텍스트 추출">📝 OCR</button>
        </div>
        <div class="tab-state" id="tab-state-fs" title="현재 추정 탭 — 클릭해서 보정"></div>
        <div class="qr-groups" id="qr-row-fs">
          <div class="qr-group" data-group="nav">
            <small class="qr-label">이동</small>
            <button class="qr fs-qr" data-vk="38" title="↑ 위 (히스토리 이전)">↑</button>
            <button class="qr fs-qr" data-vk="40" title="↓ 아래 (히스토리 다음)">↓</button>
            <button class="qr fs-qr" data-vk="37" title="← 커서 왼쪽">←</button>
            <button class="qr fs-qr" data-vk="39" title="→ 커서 오른쪽">→</button>
            <button class="qr fs-qr" data-vk="37" data-mods="17,18" data-tab-shift="-1" title="이전 터미널 탭">⬅️탭</button>
            <button class="qr fs-qr" data-vk="39" data-mods="17,18" data-tab-shift="1" title="다음 터미널 탭">탭➡️</button>
          </div>
          <div class="qr-group" data-group="resp">
            <small class="qr-label">응답</small>
            <button class="qr fs-qr" data-text="y" data-enter="true">y</button>
            <button class="qr fs-qr" data-text="n" data-enter="true">n</button>
            <button class="qr fs-qr" data-text="1" data-enter="true">1</button>
            <button class="qr fs-qr" data-text="2" data-enter="true">2</button>
            <button class="qr fs-qr" data-text="3" data-enter="true">3</button>
            <button class="qr fs-qr" data-text="4" data-enter="true">4</button>
            <button class="qr fs-qr" data-text="5" data-enter="true">5</button>
            <button class="qr fs-qr" data-text="111" data-enter="true">111</button>
            <button class="qr fs-qr danger" data-vk="27">Esc</button>
            <button class="qr fs-qr danger" data-vk="67" data-mods="17" title="현재 명령 인터럽트 (Ctrl+C)">⛔Ctrl+C</button>
          </div>
          <div class="qr-group" data-group="key">
            <small class="qr-label">키</small>
            <button class="qr fs-qr" data-vk="33" title="PageUp">⇈</button>
            <button class="qr fs-qr" data-vk="34" title="PageDown">⇊</button>
            <button class="qr fs-qr" data-vk="36" title="Home">⇱</button>
            <button class="qr fs-qr" data-vk="35" title="End">⇲</button>
            <button class="qr fs-qr" data-vk="192" data-mods="17,16" data-tab-new="1" title="새 터미널 (Ctrl+Shift+`)">➕새창</button>
            <button class="qr fs-qr" data-vk="53" data-mods="17,16" data-tab-new="1" title="터미널 스플릿 (Ctrl+Shift+5)">➗분할</button>
            <button class="qr fs-qr" data-vk="9" data-mods="16" data-repeat="1" title="Claude Code 권한모드 전환 (Shift+Tab × 1)">🔓권한</button>
            <button class="qr fs-qr folder-manage" type="button" title="폴더 등록·삭제">⚙️폴더</button>
            <span class="folder-buttons" data-fs="1"></span>
          </div>
          <div class="qr-group" data-group="macro">
            <small class="qr-label">매크로</small>
            <button class="qr fs-qr phrase" data-text="맞아 진행해" data-enter="true">진행</button>
            <button class="qr fs-qr phrase" data-text="다음 무슨 작업하면 좋을까?" data-enter="true">🤔추천</button>
            <button class="qr fs-qr phrase" data-text="메모리 갱신해줘" data-enter="true">메모리</button>
            <button class="qr fs-qr phrase" data-text="오늘 종료해" data-enter="true">종료</button>
            <button class="qr fs-qr phrase" data-text="커밋하고 푸시해줘" data-enter="true">💾커밋</button>
            <button class="qr fs-qr phrase" data-text="문제가 계속 발생하는데 왜 그런지 경우의수 파악해줘" data-enter="true">분석</button>
          </div>
        </div>
        <textarea id="fs-input" rows="3" placeholder="명령 입력 (여러 줄 가능)..."></textarea>
        <div class="fs-buttons">
          <button id="fs-activity" type="button" title="터미널 상태 (이미지 변화 기반) — 측정 중" style="background: #444; width: 28px; min-width: 28px; max-width: 28px; height: 28px; border-radius: 50%; padding: 0; flex: 0 0 auto; align-self: center; transition: background 0.3s;"></button>
          <button id="fs-voice" type="button" class="secondary" title="음성 입력 (ko-KR)" style="font-size: 1.4rem; padding: 8px 16px;">🎤</button>
          <button id="fs-send" type="button">전송+Enter</button>
          <button id="fs-bh" type="button" class="secondary" title="영역 하단 절반만 확대">하단</button>
          <button id="fs-exit" type="button" class="secondary">축소</button>
        </div>
      </div>
    </div>

    <div id="view-ocr">
      <div id="ocr-img-wrap"><img id="ocr-capture-img" alt="OCR 시점 캡처" /></div>
      <div id="ocr-meta">블록 0개</div>
      <div id="ocr-blocks-list"></div>
      <div class="ocr-action-bar">
        <select id="ocr-lang" title="OCR 언어 — 코드 위주는 영문(필터) 권장" style="padding: 8px; border: 1px solid #333; border-radius: 8px; background: #000; color: #eee; font-size: 0.9rem; flex: 0 0 130px; min-width: 130px; margin: 0;">
          <option value="eng">영문(필터)</option>
          <option value="kor+eng">한+영</option>
          <option value="kor">한글</option>
          <option value="eng:nofilter">영문(전체)</option>
        </select>
        <button id="ocr-back-btn" type="button" class="secondary">← 표준</button>
        <button id="ocr-rerun-btn" type="button" class="secondary" title="현재 OCR 영역을 다시 캡처 + OCR">🔄 다시 OCR</button>
        <button id="ocr-add-blk" type="button" class="secondary">+ 블록</button>
        <button id="ocr-to-input" type="button" class="secondary">📋 입력박스</button>
        <button id="ocr-save-feedback" type="button" class="secondary" title="현재 검수 텍스트를 정확도 개선 fixture 로 저장">💾 검수 저장</button>
        <button id="ocr-run-all" type="button">▶▶ 전체 순차</button>
      </div>
    </div>
  </section>

  <script>
    function getDeviceId() {
      let id = localStorage.getItem('mtb_device_id');
      if (!id) { id = crypto.randomUUID(); localStorage.setItem('mtb_device_id', id); }
      return id;
    }

    const $ = (id) => document.getElementById(id);

    // 모든 JSON 응답을 safe-parse — 파싱 실패 시 raw text 보존해서 디버그.
    async function safeJson(r) {
      const text = await r.text();
      try { return { ok: true, data: JSON.parse(text), raw: text }; }
      catch (e) { return { ok: false, data: null, raw: text, error: e.message }; }
    }

    // ----- 페어링 -----
    $('pair-btn').addEventListener('click', async () => {
      const code = $('code').value;  // 암호는 공백 의미 있을 수 있어 trim X
      if (!code) { setStatus('pair-status', '암호를 입력하세요.', 'err'); return; }
      setStatus('pair-status', '페어링 중...', 'busy');
      try {
        const r = await fetch('/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ code, device_id: getDeviceId() })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          setStatus('pair-status', '✓ 페어링 완료', 'ok');
          $('pair-card').hidden = true;
          $('main-card').hidden = false;
          $('tabs').hidden = false;
          loadWindowList();  // 페어링 직후 윈도우 목록 자동 로드
          startAlertPolling();  // 트리거 알림 polling 시작
        } else {
          setStatus('pair-status', `✗ ${data.error || r.statusText}`, 'err');
        }
      } catch (e) { setStatus('pair-status', `✗ ${e.message}`, 'err'); }
    });

    // ----- 캡처 -----
    let autoTimer = null;
    // ----- 영역(crop) 저장 — 윈도우 타이틀별 localStorage -----
    function getCurrentWindowKey() {
      const sel = $('target');
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.textContent) return null;
      return 'mtb_crop:' + opt.textContent.slice(0, 80);
    }
    function getCrop() {
      const key = getCurrentWindowKey();
      if (!key) return null;
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }
    function setCrop(c) {
      const key = getCurrentWindowKey();
      if (!key) return;
      if (c) localStorage.setItem(key, JSON.stringify(c));
      else localStorage.removeItem(key);
    }

    let _lastBlobUrl = null;  // blob URL 누수 방지 — 새 캡처마다 이전 URL 즉시 revoke.

    let _bottomHalfMode = false;

    // ----- 터미널 활동 상태 감지 — 영역 캡처 픽셀 diff 기반.
    // 안티그래비티 "✢ Cultivating… (51s · ↓ 3.5k tokens)" 같은 spinner/timer 가 매 프레임 변하므로
    // 화면 하단 12% 만 128×24 로 샘플링 — Antigravity 의 "(51s · ↓ 3.5k tokens)" 같은 status 라인 집중.
    // 더 좁은 영역 → spinner·타이머 변화가 평균에 묻히지 않음.
    let _activityLastSample = null;
    let _activityLastDiff = 0;
    let _activityIdleCount = 0;
    let _activityRunCount = 0;
    let _activityPrevState = null;  // 직전 단계
    let _idleEnteredAt = 0;         // idle 진입 시각 — hold 측정용
    let _chimeFired = false;        // 본 idle 사이클에서 이미 차임 울렸는지
    const ACTIVITY_IDLE_FRAMES = 4;        // 4 프레임 (2fps × 2s) 변화 없으면 대기 확정
    const ACTIVITY_DIFF_THRESHOLD = 80;    // 128×24 RGB diff 합 — 더 민감 (스피너 1글자 회전 + 초 카운터 변화)
    const CHIME_HOLD_MS = 5000;            // idle 진입 후 5초 이상 유지되어야 차임 (false alarm 완화)

    // ----- 알림음 (Web Audio API) — 외부 파일 없이 단조 합성 -----
    let _audioCtx = null;
    function getAudioCtx() {
      if (!_audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) _audioCtx = new Ctx();
      }
      return _audioCtx;
    }
    // 첫 사용자 터치 1회로 AudioContext prime — 모바일 자동재생 정책 회피.
    document.addEventListener('pointerdown', () => {
      const ctx = getAudioCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }, { once: true });

    function playIdleChime() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        // 두 톤 — 880Hz (A5) → 1320Hz (E6), 각 100ms, 사이 20ms.
        [880, 1320].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.12;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
          gain.gain.linearRampToValueAtTime(0, start + 0.1);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.12);
        });
      } catch { /* audio policy 등 무시 */ }
    }

    // canvas 1개 재사용 — 매 프레임 새 canvas 생성 시 GC pressure.
    let _activityCanvas = null;
    let _activityCtx = null;
    function sampleImageForActivity(img) {
      if (!img.complete || !img.naturalWidth) return null;
      try {
        if (!_activityCanvas) {
          _activityCanvas = document.createElement('canvas');
          _activityCanvas.width = 128;
          _activityCanvas.height = 24;
          _activityCtx = _activityCanvas.getContext('2d', { willReadFrequently: true });
        }
        const srcW = img.naturalWidth;
        const srcH = img.naturalHeight;
        const cropY = Math.floor(srcH * 0.88);  // 하단 12% — status 라인만 정밀 추출
        const cropH = srcH - cropY;
        _activityCtx.drawImage(img, 0, cropY, srcW, cropH, 0, 0, 128, 24);
        return _activityCtx.getImageData(0, 0, 128, 24).data;
      } catch { return null; }
    }

    function diffSamples(a, b) {
      if (!a || !b || a.length !== b.length) return Infinity;
      let d = 0;
      for (let i = 0; i < a.length; i += 4) {
        d += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
      }
      return d;
    }

    function updateActivityIndicator() {
      const btn = $('fs-activity');
      if (!btn || btn.style.display === 'none') return;
      // 단계 산출.
      const diff = _activityLastDiff;
      let state, bg, title;
      if (_activityLastSample === null) {
        state = 'measuring'; bg = '#444'; title = `상태 측정 중 (diff=${diff})`;
      } else if (_activityIdleCount >= ACTIVITY_IDLE_FRAMES) {
        state = 'idle'; bg = '#16a34a'; title = `대기 — 입력 가능 (idle=${_activityIdleCount}, diff=${diff})`;
      } else if (_activityRunCount > 0) {
        state = 'running'; bg = '#dc2626'; title = `실행 중 (run=${_activityRunCount}, diff=${diff})`;
      } else {
        state = 'changed'; bg = '#eab308'; title = `변화 감지 (diff=${diff})`;
      }
      btn.style.background = bg;
      btn.title = title;
      // 차임 — idle 진입 시각 기록, 3초 이상 유지된 후 1회 (전체화면 한정).
      if (state === 'idle') {
        if (_activityPrevState !== 'idle') {
          _idleEnteredAt = Date.now();
          _chimeFired = false;
        } else if (!_chimeFired
                   && _idleEnteredAt > 0
                   && Date.now() - _idleEnteredAt >= CHIME_HOLD_MS
                   && document.body.classList.contains('fs')) {
          playIdleChime();
          _chimeFired = true;
        }
      } else {
        _idleEnteredAt = 0;
        _chimeFired = false;
      }
      _activityPrevState = state;
    }

    function checkActivity() {
      if (!isAntigravitySelected()) return;
      const img = $('fs-img');
      const sample = sampleImageForActivity(img);
      if (!sample) return;
      if (_activityLastSample) {
        const diff = diffSamples(_activityLastSample, sample);
        _activityLastDiff = diff;
        if (diff < ACTIVITY_DIFF_THRESHOLD) {
          _activityIdleCount++;
          _activityRunCount = 0;
        } else {
          _activityIdleCount = 0;
          _activityRunCount++;
        }
      }
      _activityLastSample = sample;
      updateActivityIndicator();
    }

    async function refresh() {
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('cap-status', '먼저 창을 선택하세요.', 'err'); return; }
      let url = `/capture?hwnd=${encodeURIComponent(hwnd)}&t=${Date.now()}`;
      // 영역 설정 모드 중에는 전체 이미지 (crop 무시) — 사용자가 전체 위에서 새 영역 드래그.
      const c = cropMode ? null : getCrop();
      if (c) url += `&crop_x=${c.x}&crop_y=${c.y}&crop_w=${c.w}&crop_h=${c.h}`;
      // 전체화면 + 하단 절반 모드 — 영역 내 아래 절반만 (텍스트 ~2배 확대).
      if (_bottomHalfMode && document.body.classList.contains('fs')) {
        url += '&bh=1';
      }
      try {
        const r = await fetch(url, { credentials: 'include' });
        if (r.ok) {
          const blob = await r.blob();
          const u = URL.createObjectURL(blob);
          // 이전 blob URL 해제 — auto 모드에서 메모리 누수 방지.
          if (_lastBlobUrl) URL.revokeObjectURL(_lastBlobUrl);
          _lastBlobUrl = u;
          $('screen').src = u;
          $('fs-img').src = u;  // 전체 화면 뷰도 동시 갱신
          setStatus('cap-status', `✓ 갱신 ${new Date().toLocaleTimeString()}${c ? ' (영역 적용)' : ''}`, 'ok');
          // 활동 상태 감지 — fs-img 로드 직후 픽셀 샘플링.
          $('fs-img').addEventListener('load', checkActivity, { once: true });
        } else {
          const j = await safeJson(r);
          if (!j.ok) {
            console.warn('refresh raw:', j.raw);
            setStatus('cap-status', `✗ status ${r.status}: ${j.raw.slice(0, 120)}`, 'err');
          } else {
            setStatus('cap-status', `✗ ${j.data.error || r.statusText}`, 'err');
          }
        }
      } catch (e) { setStatus('cap-status', `✗ ${e.message}`, 'err'); }
    }

    $('refresh-btn').addEventListener('click', refresh);
    async function loadWindowList() {
      setStatus('cap-status', '목록 조회 중...', 'busy');
      try {
        const r = await fetch('/windows', { credentials: 'include' });
        const j = await safeJson(r);
        if (!j.ok) {
          console.warn('list raw:', j.raw);
          setStatus('cap-status', `✗ status ${r.status}: ${j.raw.slice(0, 120)}`, 'err');
          return;
        }
        if (!r.ok) {
          setStatus('cap-status', `✗ ${j.data.error || r.statusText}`, 'err');
          return;
        }
        const wins = j.data.windows || [];
        const sel = $('target');
        const prev = sel.value;
        sel.innerHTML = '<option value="">(선택)</option>' +
          wins.map(w => `<option value="${w.hwnd}">${escapeHtml(w.title)}</option>`).join('');
        // 이전 선택값 복원 시도
        if (prev && wins.some(w => String(w.hwnd) === prev)) sel.value = prev;
        setStatus('cap-status', `✓ ${wins.length} 개 윈도우`, 'ok');
        updateQrVisibility();
      } catch (e) { setStatus('cap-status', `✗ ${e.message}`, 'err'); }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    $('list-btn').addEventListener('click', loadWindowList);
    $('auto-btn').addEventListener('click', () => {
      if (autoTimer) {
        clearInterval(autoTimer); autoTimer = null;
        $('auto-btn').textContent = '자동(2fps)';
      } else {
        autoTimer = setInterval(refresh, 500);
        $('auto-btn').textContent = '자동 중지';
      }
    });

    // ----- 입력 -----
    // 송신 전 자동 ⇲ End — 스크롤백 활성 상태에서 명령 보내도 결과 보이도록.
    // localStorage 영속, default ON. nav 키 (PageUp/Down/Home/End/Esc) 호출 시는 skip.
    async function autoEndIfEnabled() {
      const chk = $('auto-end-toggle');
      if (!chk || !chk.checked) return;
      const hwnd = $('target').value;
      if (!hwnd) return;
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      try {
        await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hwnd: Number(hwnd), vk: 35, method }),  // End = 0x23
        });
        await new Promise(r => setTimeout(r, 80));  // 터미널 스크롤 완료 대기
      } catch { /* 무시 — 본 명령 송신은 그대로 진행 */ }
    }

    // auto-end-toggle localStorage 영속
    document.addEventListener('DOMContentLoaded', () => {
      const c = $('auto-end-toggle');
      if (c) {
        c.checked = localStorage.getItem('mtb_auto_end') !== '0';
        c.addEventListener('change', () => {
          localStorage.setItem('mtb_auto_end', c.checked ? '1' : '0');
        });
      }
    });

    async function send(enter) {
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('input-status', '먼저 창을 선택하세요.', 'err'); return; }
      const text = $('input-text').value;
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      setStatus('input-status', '전송 중...', 'busy');
      await autoEndIfEnabled();
      try {
        const r = await fetch('/input', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ hwnd: Number(hwnd), text, enter, method })
        });
        const j = await safeJson(r);
        if (!j.ok) {
          console.warn('input raw:', j.raw);
          setStatus('input-status', `✗ status ${r.status}: ${j.raw.slice(0, 120)}`, 'err');
          return;
        }
        if (r.ok) {
          setStatus('input-status', `✓ ${j.data.sent_chars} chars${enter ? ' + Enter' : ''} → ${j.data.target_class}`, 'ok');
          $('input-text').value = '';
        } else {
          setStatus('input-status', `✗ ${j.data.error || r.statusText}`, 'err');
        }
      } catch (e) { setStatus('input-status', `✗ ${e.message}`, 'err'); }
    }

    $('send-btn').addEventListener('click', () => send(false));
    $('send-enter-btn').addEventListener('click', () => send(true));
    $('enter-only-btn').addEventListener('click', async () => {
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('input-status', '먼저 창을 선택하세요.', 'err'); return; }
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      const r = await fetch('/input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ hwnd: Number(hwnd), text: '', enter: true, method })
      });
      const j = await safeJson(r);
      if (!j.ok) { setStatus('input-status', `✗ status ${r.status}: ${j.raw.slice(0, 120)}`, 'err'); return; }
      setStatus('input-status', r.ok ? '✓ Enter 전송' : `✗ ${j.data.error}`, r.ok ? 'ok' : 'err');
    });

    function setStatus(id, msg, kind = '') {
      const e = $(id); e.textContent = msg; e.className = 'status ' + kind;
    }

    // ----- 영역 드래그 선택 -----
    let cropMode = false;
    let dragInfo = null;  // {startX, startY, imgW, imgH}
    let dragging = false; // pointerdown ~ pointerup 사이만 true

    function updateCropBtnLabel() {
      const c = getCrop();
      $('crop-set-btn').textContent = cropMode ? '영역 확정' : (c ? '영역 재선택' : '영역 설정');
      const status = c ? `✓ 영역 ${c.w}×${c.h} (${c.x},${c.y})` : (cropMode ? '드래그로 사각형 선택 → 영역 확정 클릭' : '전체 화면 캡처 중');
      setStatus('crop-status', status, c ? 'ok' : (cropMode ? 'busy' : ''));
    }

    function pointerToImageCoords(e) {
      const img = $('screen');
      const rect = img.getBoundingClientRect();
      const x = (e.clientX ?? e.touches?.[0]?.clientX) - rect.left;
      const y = (e.clientY ?? e.touches?.[0]?.clientY) - rect.top;
      return { x, y, dispW: rect.width, dispH: rect.height, imgW: img.naturalWidth, imgH: img.naturalHeight };
    }

    function startCropDrag(e) {
      if (!cropMode) return;
      e.preventDefault();
      const p = pointerToImageCoords(e);
      dragInfo = p;
      dragging = true;
      const cr = $('crop-rect');
      cr.style.display = 'block';
      cr.style.left = p.x + 'px';
      cr.style.top = p.y + 'px';
      cr.style.width = '0px';
      cr.style.height = '0px';
    }

    function moveCropDrag(e) {
      if (!cropMode || !dragging || !dragInfo) return;
      e.preventDefault();
      const p = pointerToImageCoords(e);
      const left = Math.min(dragInfo.x, p.x);
      const top = Math.min(dragInfo.y, p.y);
      const w = Math.abs(p.x - dragInfo.x);
      const h = Math.abs(p.y - dragInfo.y);
      const cr = $('crop-rect');
      cr.style.left = left + 'px';
      cr.style.top = top + 'px';
      cr.style.width = w + 'px';
      cr.style.height = h + 'px';
    }

    function endCropDrag(e) {
      if (!cropMode || !dragging) return;
      e.preventDefault();
      dragging = false;  // rect 위치 유지, 추가 mousemove 무시.
    }

    $('crop-overlay').addEventListener('pointerdown', startCropDrag);
    $('crop-overlay').addEventListener('pointermove', moveCropDrag);
    $('crop-overlay').addEventListener('pointerup', endCropDrag);
    $('crop-overlay').addEventListener('pointercancel', endCropDrag);

    $('crop-set-btn').addEventListener('click', async () => {
      if (!cropMode) {

      // 확정 — 현재 사각형 → image natural coords 변환 후 저장.
      const cr = $('crop-rect');

      if (cr.style.display === 'block' && dragInfo) {
        const left = parseFloat(cr.style.left) || 0;
        const top = parseFloat(cr.style.top) || 0;
        const w = parseFloat(cr.style.width) || 0;
        const h = parseFloat(cr.style.height) || 0;
        if (w > 5 && h > 5 && dragInfo.imgW > 0 && dragInfo.imgH > 0) {
          const sx = dragInfo.imgW / dragInfo.dispW;
          const sy = dragInfo.imgH / dragInfo.dispH;
          const newCrop = {
            x: Math.round(left * sx),
            y: Math.round(top * sy),
            w: Math.round(w * sx),
            h: Math.round(h * sy),
          };
          setCrop(newCrop);
          debugMsg = `crop=(${newCrop.x},${newCrop.y}) ${newCrop.w}×${newCrop.h} / disp ${Math.round(dragInfo.dispW)}×${Math.round(dragInfo.dispH)} / nat ${dragInfo.imgW}×${dragInfo.imgH}`;
        } else {
          debugMsg = `버려짐: w=${w} h=${h} imgW=${dragInfo.imgW} imgH=${dragInfo.imgH}`;

    // ----- 음성 입력 (Web Speech API, ko-KR) — 표준·전체화면 양쪽 공통 -----
    let _recognition = null;
    let _listening = false;
    let _voiceTarget = 'input-text';  // 현재 활성 input element id

    function getRecognition() {
      if (_recognition) return _recognition;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      _recognition = new SR();
      _recognition.lang = 'ko-KR';
      _recognition.continuous = false;
      _recognition.interimResults = true;
      _recognition.maxAlternatives = 3;
      _recognition.onresult = (e) => {
        let finalText = '';
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript;
          else interim += r[0].transcript;
        }
        if (finalText) {
          const inp = $(_voiceTarget);
          if (inp) inp.value = (inp.value + (inp.value ? ' ' : '') + finalText.trim()).trim();
        }
        if (interim) setStatus('input-status', `🎤 ${interim}`, 'busy');
      };
      const onStart = () => {
        _listening = true;
        ['voice-btn', 'fs-voice'].forEach(id => {
          const b = $(id); if (b) { b.style.background = '#dc2626'; b.style.color = '#fff'; }
        });
        setStatus('input-status', '🎤 듣는 중', 'busy');
      };
      const onEnd = () => {
        _listening = false;
        ['voice-btn', 'fs-voice'].forEach(id => {
          const b = $(id); if (b) { b.style.background = ''; b.style.color = ''; }
        });
      };
      _recognition.onstart = onStart;
      _recognition.onend = onEnd;
      _recognition.onerror = (e) => { onEnd(); setStatus('input-status', `✗ 음성 오류: ${e.error}`, 'err'); };
      return _recognition;
    }

    function toggleVoice(targetId) {
      const sr = getRecognition();
      if (!sr) { setStatus('input-status', '✗ 이 브라우저는 음성 인식 미지원 (Chrome 권장)', 'err'); return; }
      _voiceTarget = targetId;
      if (_listening) sr.stop();
      else try { sr.start(); } catch (e) { /* already running */ }
    }

    $('voice-btn').addEventListener('click', () => toggleVoice('input-text'));
    $('fs-voice').addEventListener('click', () => toggleVoice('fs-input'));

    // 종 알림 비활성 — 서버측 /admin/output feeder 미구현. push (M5-T3) 도입 시 부활.

    // ----- Quick-reply 단추 (y/n/1-5/Esc/nav) — 표준·전체화면 양쪽 같이 동작 -----
    // nav 키 (PageUp/Down/Home/End/Esc) 는 본질이 *스크롤·취소* 라서 auto-end 건너뜀.
    const _NAV_VKS = new Set([27, 33, 34, 35, 36, 37, 38, 39, 40]);  // Esc/PgUp/PgDn/End/Home/Left/Up/Right/Down

    async function qrSend(btn) {
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('input-status', '먼저 창을 선택하세요.', 'err'); return; }
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      const body = { hwnd: Number(hwnd), method };
      let isNav = false;
      if (btn.dataset.vk) {
        body.vk = parseInt(btn.dataset.vk);
        if (btn.dataset.mods) body.mods = btn.dataset.mods.split(',').map(s => parseInt(s.trim()));
        if (btn.dataset.repeat) body.repeat = parseInt(btn.dataset.repeat);
        // nav 키 또는 modifier 동반 키 (Shift+Tab 등 단축) 는 auto-end 건너뜀 — 본질이 명령 입력 아님.
        isNav = _NAV_VKS.has(body.vk) || (body.mods && body.mods.length > 0);
      } else {
        body.text = btn.dataset.text || '';
        body.enter = btn.dataset.enter === 'true';
      }
      // 텍스트 송신은 auto-end 적용. VK nav 키는 건너뜀 (그 자체가 스크롤 의도).
      if (!isNav) await autoEndIfEnabled();
      try {
        const r = await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const j = await safeJson(r);
        if (r.ok && j.ok) {
          const lbl = btn.dataset.vk ? `vk=${btn.dataset.vk}` : `"${body.text}"${body.enter ? ' ↵' : ''}`;
          setStatus('input-status', `✓ ${lbl}`, 'ok');
          // 탭 인덱스 추적 — 송신 성공 시에만 갱신.
          if (btn.dataset.tabShift) tabShift(parseInt(btn.dataset.tabShift));
          else if (btn.dataset.tabNew) tabAppend({ label: '(미등록)', path: null });
        } else {
          setStatus('input-status', `✗ ${(j.data && j.data.error) || r.statusText}`, 'err');
        }
      } catch (e) { setStatus('input-status', `✗ ${e.message}`, 'err'); }
    }
    document.querySelectorAll('button.qr').forEach(btn => {
      // copy/paste 단추는 별도 핸들러
      if (btn.id === 'copy-btn' || btn.id === 'paste-btn' || btn.id === 'fs-copy-btn' || btn.id === 'fs-paste-btn') return;
      // 폴더 관리/동적 폴더 단추는 별도 핸들러 (folderManage / openTerminalIn)
      if (btn.classList.contains('folder-manage') || btn.classList.contains('folder-btn')) return;
      btn.addEventListener('click', () => qrSend(btn));
    });

    // ----- 방안 A — 프로젝트 폴더 macro (localStorage + 새 터미널 + cd 시퀀스) -----
    const FOLDER_STORE_KEY = 'mtb_terminal_folders';
    function loadFolders() {
      try {
        const raw = localStorage.getItem(FOLDER_STORE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    }
    function saveFolders(arr) {
      localStorage.setItem(FOLDER_STORE_KEY, JSON.stringify(arr));
    }
    function renderFolderButtons() {
      const folders = loadFolders();
      document.querySelectorAll('.folder-buttons').forEach(cont => {
        cont.innerHTML = '';
        const isFs = cont.dataset.fs === '1';
        folders.forEach(f => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = isFs ? 'qr fs-qr folder-btn' : 'qr folder-btn';
          b.title = `${f.label} → 새 터미널 + cd "${f.path}"`;
          b.textContent = `📁 ${f.label}`;

    async function openTerminalIn(path, label) {
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('input-status', '먼저 창을 선택하세요.', 'err'); return; }
      setStatus('input-status', `📁 ${label} → 새 터미널 + cd`, 'busy');
      try {
        // (1) Ctrl+Shift+` 새 터미널 — sendinput 강제 (Electron 대상 가정)
        await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hwnd: Number(hwnd), method: 'sendinput', vk: 192, mods: [17, 16] }),
        });
        // (2) PowerShell prompt 준비 대기 — 환경 따라 500~1500ms 튜닝 가능
        await new Promise(r => setTimeout(r, 800));
        // (3) cd "path" + Enter
        const r = await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hwnd: Number(hwnd), method: 'sendinput', text: `cd "${path}"`, enter: true }),
        });
        const j = await safeJson(r);
        if (r.ok && j.ok) {
          setStatus('input-status', `✓ ${label} 새 터미널 열림`, 'ok');
          // 탭 인덱스 추적 — 새 터미널 열렸으니 tab_order 끝에 append.
          tabAppend({ label, path });
        } else {
          setStatus('input-status', `✗ cd 송신 실패: ${(j.data && j.data.error) || r.statusText}`, 'err');
        }
      } catch (e) {
        setStatus('input-status', `✗ ${e.message}`, 'err');
      }
    }

    // ----- 탭 인덱스 추적 (방안 A) — 폴더 매크로/⬅️탭/탭➡️/➕새창/➗분할 클릭 기반 -----
    const TAB_STATE_KEY = 'mtb_tab_state';
    function loadTabState() {
      try {
        const raw = localStorage.getItem(TAB_STATE_KEY);
        if (!raw) return { order: [], current: -1 };
        const s = JSON.parse(raw);
        if (!Array.isArray(s.order)) return { order: [], current: -1 };
        return { order: s.order, current: typeof s.current === 'number' ? s.current : -1 };
      } catch { return { order: [], current: -1 }; }
    }
    function saveTabState(s) {
      localStorage.setItem(TAB_STATE_KEY, JSON.stringify(s));
    }
    function tabAppend(folder) {
      const s = loadTabState();
      s.order.push(folder);
      s.current = s.order.length - 1;
      saveTabState(s);
      renderTabState();
    }
    function tabShift(delta) {
      const s = loadTabState();
      if (s.order.length === 0) return;
      s.current = (s.current + delta + s.order.length) % s.order.length;
      saveTabState(s);
      renderTabState();
    }
    function renderTabState() {
      const s = loadTabState();
      document.querySelectorAll('.tab-state').forEach(el => {
        if (s.order.length === 0 || s.current < 0 || s.current >= s.order.length) {
          el.textContent = '';
          return;
        }
        const cur = s.order[s.current];
        el.textContent = `탭 ${s.current + 1}/${s.order.length}: 📁 ${cur.label}`;
      });
    }
    function adjustTabState() {
      const s = loadTabState();
      const list = s.order.length === 0
        ? '(추적 없음)'
        : s.order.map((f, i) => `${i + 1}. ${i === s.current ? '▶ ' : '  '}${f.label}`).join('\n');
      const cmd = prompt(
        `탭 보정. 현재 순서:\n${list}\n\n작업:\n  N → N 번째 탭 활성으로\n  +label → 끝에 새 탭 추가\n  -N → N 번째 탭 삭제\n  ! → 전체 초기화\n  취소 → 빈 입력`,
        ''
      );
      if (!cmd) return;
      const t = cmd.trim();
      if (t === '!') { saveTabState({ order: [], current: -1 }); renderTabState(); return; }
      if (t.startsWith('+')) {
        const label = t.slice(1).trim();
        if (!label) { alert('label 비어있음'); return; }
        tabAppend({ label, path: null });
        return;
      }
      if (t.startsWith('-')) {
        const n = parseInt(t.slice(1), 10);
        if (isNaN(n) || n < 1 || n > s.order.length) { alert('범위 밖'); return; }
        s.order.splice(n - 1, 1);
        if (s.current >= s.order.length) s.current = s.order.length - 1;
        saveTabState(s);
        renderTabState();
        return;
      }
      const n = parseInt(t, 10);
      if (isNaN(n) || n < 1 || n > s.order.length) { alert('범위 밖'); return; }
      s.current = n - 1;
      saveTabState(s);
      renderTabState();
    }
    document.querySelectorAll('.tab-state').forEach(el => el.addEventListener('click', adjustTabState));
    renderTabState();
    function manageFolders() {
      const folders = loadFolders();
      const summary = folders.length === 0 ? '(등록된 폴더 없음)' : folders.map((f, i) => `${i + 1}. ${f.label} — ${f.path}`).join('\n');
      const cmd = prompt(
        `폴더 목록:\n${summary}\n\n작업:\n  추가/갱신 → 'label|C:\\path' 형식\n  삭제 → '-label'\n  취소 → 빈 입력`,
        ''
      );
      if (!cmd) return;
      const trimmed = cmd.trim();
      if (trimmed.startsWith('-')) {
        const target = trimmed.slice(1).trim();
        const idx = folders.findIndex(f => f.label === target);
        if (idx < 0) { alert(`'${target}' 라벨 없음`); return; }
        folders.splice(idx, 1);
        saveFolders(folders);
        renderFolderButtons();
        setStatus('input-status', `✓ 폴더 '${target}' 삭제`, 'ok');
        return;
      }
      const m = trimmed.match(/^([^|]+?)\|(.+)$/);
      if (!m) { alert("형식 오류: 'label|C:\\path' 또는 '-label'"); return; }
      const label = m[1].trim();
      const path = m[2].trim();
      if (!label || !path) { alert('label 과 path 모두 필요'); return; }
      const existing = folders.findIndex(f => f.label === label);
      if (existing >= 0) folders[existing].path = path;
      else folders.push({ label, path });
      saveFolders(folders);
      renderFolderButtons();
      setStatus('input-status', `✓ 폴더 '${label}' ${existing >= 0 ? '갱신' : '추가'}`, 'ok');
    }
    document.querySelectorAll('.folder-manage').forEach(b => b.addEventListener('click', manageFolders));
    renderFolderButtons();

    // ----- 복사 + 창 전환 + 붙여넣기 — Antigravity → PowerShell 패턴 -----
    let _pwaClipboard = '';

    function getActiveInputElem() {
      return document.body.classList.contains('fs') ? $('fs-input') : $('input-text');
    }

    function findAllPasteTargets() {
      const sel = $('target');
      const patterns = [/powershell/i, /\bcmd\b/i, /명령 프롬프트/i, /windows terminal/i, /terminal/i];
      const results = [];
      for (let i = 0; i < sel.options.length; i++) {
        const opt = sel.options[i];
        const t = opt.textContent || '';
        if (patterns.some(pat => pat.test(t))) results.push({ value: opt.value, label: t });
      }
      return results;
    }

    function doCopyAndSwitch() {
      const inp = getActiveInputElem();
      const text = inp.value;
      if (!text) { setStatus('input-status', '✗ 입력 박스가 비어있음', 'err'); return; }
      _pwaClipboard = text;
      const targets = findAllPasteTargets();
      if (targets.length === 0) {
        setStatus('input-status', `✓ 복사 ${text.length} chars — PowerShell 류 없음, 드롭다운 직접 선택 후 붙여넣기`, 'ok');
        return;
      }
      let chosen;
      if (targets.length === 1) {
        chosen = targets[0];
      } else {
        // 멀티 — 마지막 선택 우선 → 일치 안 되면 prompt 로 사용자 선택.
        const savedPrefix = localStorage.getItem('mtb_paste_target_prefix') || '';
        chosen = savedPrefix ? targets.find(t => t.label.startsWith(savedPrefix)) : null;
        if (!chosen) {
          const lines = targets.map((t, i) => `${i + 1}. ${t.label.slice(0, 60)}`).join('\n');
          const pick = prompt(`PowerShell 여러 개 (${targets.length}). 번호 선택 (1~${targets.length}):\n\n${lines}`);
          const idx = parseInt(pick, 10) - 1;
          if (isNaN(idx) || idx < 0 || idx >= targets.length) {
            setStatus('input-status', '✗ 선택 취소', 'err');
            return;
          }
          chosen = targets[idx];
        }
      }
      const dropdown = $('target');
      dropdown.value = chosen.value;
      dropdown.dispatchEvent(new Event('change'));
      // 다음 번 같은 PowerShell 자동 선택용 — title 앞 30자 저장.
      localStorage.setItem('mtb_paste_target_prefix', chosen.label.slice(0, 30));
      setStatus('input-status', `✓ 복사 (${text.length}) → "${chosen.label.slice(0, 30)}" (다음에도 자동)`, 'ok');
    }

    async function doPaste() {
      if (!_pwaClipboard) { setStatus('input-status', '✗ 복사된 내용 없음', 'err'); return; }
      const hwnd = $('target').value;
      if (!hwnd) { setStatus('input-status', '✗ 먼저 창 선택', 'err'); return; }
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      await autoEndIfEnabled();
      try {
        const r = await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hwnd: Number(hwnd), text: _pwaClipboard, enter: false, method }),
        });
        const j = await safeJson(r);
        if (r.ok && j.ok) {
          setStatus('input-status', `✓ 붙여넣기 ${_pwaClipboard.length} chars → ${j.data.target_class}`, 'ok');
        } else {
          setStatus('input-status', `✗ ${(j.data && j.data.error) || r.statusText}`, 'err');
        }
      } catch (e) { setStatus('input-status', `✗ ${e.message}`, 'err'); }
    }

    $('copy-btn').addEventListener('click', doCopyAndSwitch);
    $('paste-btn').addEventListener('click', doPaste);
    $('fs-copy-btn').addEventListener('click', doCopyAndSwitch);
    $('fs-paste-btn').addEventListener('click', doPaste);

    // ----- OCR — 현재 표시된 캡처 이미지에서 텍스트 추출 (tesseract.js 자체 호스팅 + 영문 모델 ~11MB) -----
    async function runOcr() {
      if (typeof Tesseract === 'undefined') {
        setStatus('input-status', '✗ tesseract.js 로드 실패', 'err');
        return;
      }
      // 영역 설정 모드 중에는 OCR 차단 — 그 상태에서는 전체 이미지 표시 (crop 미적용) 이라 잘못된 영역 OCR 됨.
      if (cropMode) {
        setStatus('input-status', '✗ 영역 설정 모드 — 영역 확정 후 OCR', 'err');
        return;
      }
      // OCR 전용 영역 설정되어 있으면 — *서버측 pytesseract* 로 위임 (네이티브 Tesseract.exe, 한글 정확도 ↑, 빠름).
      const ocrCrop = getOcrCrop();
      if (ocrCrop) {
        const hwnd = $('target').value;
        if (!hwnd) { setStatus('input-status', '✗ 먼저 창 선택', 'err'); return; }
        const langPref = localStorage.getItem('mtb_ocr_lang') || 'eng';
        setStatus('input-status', `🔍 서버 OCR 진행 중 (${ocrCrop.w}×${ocrCrop.h}, lang=${langPref})`, 'busy');
        const btns = ['ocr-btn', 'fs-ocr-btn'].map(id => $(id)).filter(b => b);
        const origLabels = btns.map(b => b.textContent);
        btns.forEach(b => { b.disabled = true; b.textContent = '⏳'; });
        try {
          const ocrUrl = `/ocr?hwnd=${encodeURIComponent(hwnd)}&crop_x=${ocrCrop.x}&crop_y=${ocrCrop.y}&crop_w=${ocrCrop.w}&crop_h=${ocrCrop.h}&lang=${encodeURIComponent(langPref)}&upscale=3&psm=6`;
          const r = await fetch(ocrUrl, { credentials: 'include' });
          const j = await safeJson(r);
          if (!r.ok || !j.ok) {
            setStatus('input-status', `✗ 서버 OCR 실패: ${(j.data && j.data.error) || r.statusText}`, 'err');
            return;
          }
          _ocrLogId = (j.data && j.data.log_id) || null;
          let text = (j.data.text || '').trim();
          if (!text) {
            setStatus('input-status', '✗ 서버 OCR 빈 결과', 'err');
            return;
          }
          // 한글 필터 (영문 모드 + filter 토글) — 클라이언트 측에서 같은 로직 재사용
          const filterKor = localStorage.getItem('mtb_ocr_filter_kor') !== '0';
          if (filterKor && langPref === 'eng') {
            const before = text.split('\n').length;
            text = text.split('\n').filter(line => {
              if (!line.trim()) return false;
              const k = (line.match(/[가-힣]/g) || []).length;
              const t = line.replace(/\s/g, '').length;
              return t === 0 || k / t < 0.3;
            }).join('\n');
            const after = text.split('\n').length;
            setStatus('input-status', `📝 서버 OCR — 한글 ${before - after}/${before} 제외, ${after} 줄`, 'ok');
          }
          // OCR 탭 검수용 캡처 이미지 — 같은 URL 의 png 버전을 dataURL 로
          let captureURL = '';
          try {
            const imgUrl = `/capture?hwnd=${encodeURIComponent(hwnd)}&t=${Date.now()}&crop_x=${ocrCrop.x}&crop_y=${ocrCrop.y}&crop_w=${ocrCrop.w}&crop_h=${ocrCrop.h}&ocr=1&upscale=2`;
            const ir = await fetch(imgUrl, { credentials: 'include' });
            if (ir.ok) {
              const blob = await ir.blob();
              captureURL = await new Promise(res => {
                const r = new FileReader();
                r.onloadend = () => res(r.result);
                r.readAsDataURL(blob);
              });
            }
          } catch {}
          renderOcrTab(text, captureURL);
          switchTab('ocr');
          return;
        } catch (e) {
          setStatus('input-status', `✗ 서버 OCR 실패: ${e.message}`, 'err');
          return;
        } finally {
          btns.forEach((b, i) => { b.disabled = false; b.textContent = origLabels[i]; });
        }
      }
      // ----- OCR 전용 영역 미설정 — tesseract.js 클라이언트 OCR fallback -----
      // 클라 OCR 은 서버 로그에 기록 안 함 — 검수 저장 비활성.
      _ocrLogId = null;
      let img;
      {
        // OCR 전용 영역 미설정 — 화면 crop fallback.
        if (!getCrop()) {
          const ok = confirm('영역이 설정되지 않음 — 전체 캡처 OCR 진행할까요?\n(권장: "📝 OCR영역 설정" 으로 터미널 영역 한 번 지정)');
          if (!ok) { setStatus('input-status', 'OCR 취소', ''); return; }
        }
        img = document.body.classList.contains('fs') ? $('fs-img') : $('screen');
      }
      if (!img.src || img.src === window.location.href) {
        setStatus('input-status', '✗ 캡처 이미지 없음 — 먼저 캡처', 'err');
        return;
      }
      // 표준·전체화면 양쪽 단추 동기 disable.
      const btns = ['ocr-btn', 'fs-ocr-btn'].map(id => $(id)).filter(b => b);
      const origLabels = btns.map(b => b.textContent);
      btns.forEach(b => { b.disabled = true; b.textContent = '⏳'; });
      setStatus('input-status', '🔍 OCR 진행 중 (첫 회 약 11MB 모델 로드)', 'busy');
      try {
        // ----- 전처리: 3x 업스케일 + 자동 반전 + 그레이스케일 + 이진화 (B&W) -----
        // 갤럭시 탭 등 고해상도 화면의 작은 터미널 폰트 OCR 정확도 향상.
        // 이진화 (binarize) 는 색상·anti-aliasing artifact 제거 → tesseract 정확도 큰 폭 향상.
        const natW = img.naturalWidth || img.width;
        const natH = img.naturalHeight || img.height;
        const scale = 3;
        const canvas = document.createElement('canvas');
        canvas.width = natW * scale;
        canvas.height = natH * scale;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;  // 픽셀 보존 (텍스트 에지 sharp)
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        // 평균 밝기 샘플링 — 어두우면 (Antigravity 등 dark theme) 색 반전.
        let bright = 0;
        const N = Math.min(2000, Math.floor(data.length / 4));
        for (let i = 0; i < N; i++) {
          const idx = Math.floor((data.length / 4) * (i / N)) * 4;
          bright += (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
        }
        bright /= N;
        const isDark = bright < 128;
        // 1) 그레이스케일 + 필요 시 반전 + 2) 임계값 이진화. 단일 루프 처리.
        const threshold = 140;
        for (let i = 0; i < data.length; i += 4) {
          // ITU-R BT.601 가중 그레이.
          let g = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (isDark) g = 255 - g;  // dark theme: 밝은 글자 → 어두운 글자로
          const bw = g < threshold ? 0 : 255;
          data[i] = data[i + 1] = data[i + 2] = bw;
        }
        ctx.putImageData(imageData, 0, 0);
        setStatus('input-status', `🔍 OCR (3x B&W ${canvas.width}×${canvas.height}, ${isDark ? 'inverted' : 'normal'})`, 'busy');

        // 언어 모드 — OCR 탭의 셀렉트 또는 localStorage. default eng (코드 인식 위주).
        const lang = localStorage.getItem('mtb_ocr_lang') || 'eng';
        const result = await Tesseract.recognize(canvas, lang, {
          workerPath: '/lib/worker.min.js',
          corePath: '/lib/',
          langPath: '/data/',
        });
        let text = (result.data.text || '').trim();
        if (!text) {
          setStatus('input-status', '✗ 추출된 텍스트 없음', 'err');
          return;
        }
        // 한글 줄 자동 필터 — 영문/숫자/기호 위주 줄만 유지. 기본 ON. localStorage 토글.
        const filterKor = localStorage.getItem('mtb_ocr_filter_kor') !== '0';
        if (filterKor) {
          const before = text.split('\n').length;
          text = text.split('\n').filter(line => {
            if (!line.trim()) return false;
            const koreanCount = (line.match(/[가-힣]/g) || []).length;
            const totalNonWs = line.replace(/\s/g, '').length;
            // 30% 이상 한글이면 제거 — 영문/숫자/기호 위주 줄만 통과.
            return totalNonWs === 0 || koreanCount / totalNonWs < 0.3;
          }).join('\n');
          const after = text.split('\n').length;
          setStatus('input-status', `📝 한글 줄 ${before - after}/${before} 제외, ${after} 줄 추출`, 'ok');
        }
        // OCR 시점 전처리된 canvas 를 PNG dataURL 로 보존 — 검수 탭에서 그대로 보여주기 위해.
        const captureURL = canvas.toDataURL('image/png');
        renderOcrTab(text, captureURL);
        switchTab('ocr');
      } catch (e) {
        const msg = e ? (e.message || (typeof e === 'string' ? e : JSON.stringify(e))) : 'unknown';
        console.error('OCR error:', e);
        setStatus('input-status', `✗ OCR 오류: ${msg || '(빈 메시지 — F12 콘솔 확인)'}`, 'err');
      } finally {
        btns.forEach((b, i) => { b.disabled = false; b.textContent = origLabels[i]; });
      }
    }
    $('fs-ocr-btn').addEventListener('click', runOcr);
    $('ocr-btn').addEventListener('click', runOcr);

    // ----- OCR 검수 탭 — 캡처 이미지 + 블록별 인라인 편집 + 순차 실행 -----
    function isLikelyCodeLine(line) {
      const t = line.trim();
      if (t.length < 3) return false;
      // UI 아이콘·단일 기호만 있는 줄 제외
      if (/^[●▼▲△▽◀▶✕×↑↓✓☰⋮⋯•·…\-=_]+$/.test(t)) return false;
      // 코드/명령 특징
      return /[\$>{}();=\\\/|]|^PS\b|^#|^>|git\b|npm\b|cd\b|ls\b|pip\b|python\b|node\b|powershell|pytest|venv|set\s|export\s|echo\s|mkdir|rm\s|cp\s|mv\s|chmod|ssh\s|curl\s|wget/i.test(t)
        || /^[a-zA-Z]+[-_][a-zA-Z]+/.test(t)  // dash-words 패턴 (e.g., docker-compose)
        || /^\s*\d+\)/.test(line);  // "1) " 같은 번호 매겨진 항목
    }

    // OCR 텍스트 → 연속 코드 라인 그룹 (블록). 빈 줄 / 비코드 줄 만나면 블록 종료.
    function detectCodeBlocks(text) {
      const lines = text.split('\n').map(l => l.trimEnd());
      const blocks = [];
      let cur = [];
      for (const line of lines) {
        if (line.trim() === '' || !isLikelyCodeLine(line)) {
          if (cur.length > 0) { blocks.push(cur.join('\n')); cur = []; }
        } else {
          cur.push(line);
        }
      }
      if (cur.length > 0) blocks.push(cur.join('\n'));
      return blocks;
    }

    function updateOcrMeta() {
      const codes = $('ocr-blocks-list').querySelectorAll('code[contenteditable]');
      $('ocr-meta').textContent = `${codes.length}개 블록 — 탭하면 인라인 편집, ▶ 로 개별 실행, 🗑 로 삭제`;
    }

    function addOcrBlock(text) {
      const list = $('ocr-blocks-list');
      const row = document.createElement('div');
      row.className = 'ocr-block';
      row.innerHTML = '<button class="block-run" type="button">▶ 실행</button>' +
                      '<code contenteditable="plaintext-only" spellcheck="false"></code>' +
                      '<button class="block-del" type="button">🗑</button>';
      row.querySelector('code').textContent = text || '';
      list.appendChild(row);
      updateOcrMeta();
    }

    // 이전 OCR 의 dataURL 보관 — 새 OCR 시 또는 표준 탭 복귀 시 해제.
    let _ocrLastDataURL = null;
    // 서버 OCR 호출 시 받은 log_id — 검수본 feedback POST 시 참조. 클라 tesseract.js 는 null.
    let _ocrLogId = null;
    function releaseOcrCapture() {
      const img = $('ocr-capture-img');
      if (img) img.removeAttribute('src');
      _ocrLastDataURL = null;
    }

    // 현재 OCR 블록들의 검수 텍스트를 서버에 fixture 로 저장.
    async function saveOcrFeedback(silent) {
      if (!_ocrLogId) return false;
      const codes = $('ocr-blocks-list').querySelectorAll('code[contenteditable]');
      const corrected = Array.from(codes).map(c => c.textContent).join('\n');
      try {
        const r = await fetch('/ocr/feedback', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ log_id: _ocrLogId, corrected }),
        });
        if (!r.ok) {
          if (!silent) setStatus('input-status', `✗ 검수 저장 실패 (${r.status})`, 'err');
          return false;
        }
        if (!silent) setStatus('input-status', `💾 검수 저장 (${_ocrLogId})`, 'ok');
        return true;
      } catch (e) {
        if (!silent) setStatus('input-status', `✗ 검수 저장 실패: ${e.message}`, 'err');
        return false;
      }
    }
    function renderOcrTab(text, captureURL) {
      const blocks = detectCodeBlocks(text);
      const list = $('ocr-blocks-list');
      list.innerHTML = '';
      // 새 dataURL 로 교체 — 이전 dataURL 은 GC 대상.
      _ocrLastDataURL = captureURL || null;
      $('ocr-capture-img').src = captureURL || '';
      if (blocks.length === 0) {
        // 코드 블록 검출 실패 — 원본 텍스트 자체를 단일 블록으로 띄워 사용자가 편집.
        addOcrBlock(text);
      } else {
        blocks.forEach(b => addOcrBlock(b));
      }
      setStatus('input-status', `📝 OCR 완료 — OCR 탭에서 검수`, 'ok');
    }

    // 위임 이벤트 — ▶ 실행 / 🗑 삭제.
    $('ocr-blocks-list').addEventListener('click', async (e) => {
      const row = e.target.closest('.ocr-block');
      if (!row) return;
      if (e.target.classList.contains('block-run')) {
        const code = row.querySelector('code').textContent.trim();
        if (!code) return;
        await pasteBlockToTerminal(code, '블록 1개');
        saveOcrFeedback(true);
      } else if (e.target.classList.contains('block-del')) {
        row.remove();
        updateOcrMeta();
      }
    });

    // PowerShell 자동 선택 + 텍스트 + Enter. 멀티-PowerShell 시 저장된 선택 우선, 없으면 prompt.
    async function pasteBlockToTerminal(text, label) {
      const targets = findAllPasteTargets();
      if (targets.length === 0) {
        setStatus('input-status', '✗ PowerShell 류 윈도우 없음', 'err');
        return false;
      }
      let chosen;
      if (targets.length === 1) chosen = targets[0];
      else {
        const savedPrefix = localStorage.getItem('mtb_paste_target_prefix') || '';
        chosen = savedPrefix ? targets.find(t => t.label.startsWith(savedPrefix)) : null;
        if (!chosen) {
          const list = targets.map((t, i) => `${i + 1}. ${t.label.slice(0, 60)}`).join('\n');
          const pick = prompt(`PowerShell 선택 (1~${targets.length}):\n\n${list}`);
          const idx = parseInt(pick, 10) - 1;
          if (isNaN(idx) || idx < 0 || idx >= targets.length) { setStatus('input-status', '✗ 선택 취소', 'err'); return false; }
          chosen = targets[idx];
          localStorage.setItem('mtb_paste_target_prefix', chosen.label.slice(0, 30));
        }
      }
      const method = $('method-sendinput').checked ? 'sendinput' : 'wm_char';
      await autoEndIfEnabled();
      try {
        const r = await fetch('/input', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hwnd: Number(chosen.value), text, enter: false, method }),
        });
        const j = await safeJson(r);
        if (r.ok && j.ok) {
          setStatus('input-status', `✓ ${label} → "${chosen.label.slice(0, 30)}" (${text.split('\n').length}줄)`, 'ok');
          return true;
        }
        setStatus('input-status', `✗ ${(j.data && j.data.error) || r.statusText}`, 'err');
        return false;
      } catch (e) { setStatus('input-status', `✗ ${e.message}`, 'err'); return false; }
    }

    // 언어 셀렉트 — localStorage 영속. "영문(필터)" 는 eng + 한글 줄 자동 제외, "영문(전체)" 는 eng 만 (필터 X).
    {
      const langSel = $('ocr-lang');
      if (langSel) {
        const savedLang = localStorage.getItem('mtb_ocr_lang') || 'eng';
        const savedFilter = localStorage.getItem('mtb_ocr_filter_kor') !== '0';
        // 두 설정 합쳐서 셀렉트 단일 값으로 표현.
        if (savedLang === 'eng' && !savedFilter) langSel.value = 'eng:nofilter';
        else langSel.value = savedLang;
        langSel.addEventListener('change', () => {
          const v = langSel.value;
          if (v === 'eng:nofilter') {
            localStorage.setItem('mtb_ocr_lang', 'eng');
            localStorage.setItem('mtb_ocr_filter_kor', '0');
          } else if (v === 'eng') {
            localStorage.setItem('mtb_ocr_lang', 'eng');
            localStorage.setItem('mtb_ocr_filter_kor', '1');
          } else {
            localStorage.setItem('mtb_ocr_lang', v);
            localStorage.setItem('mtb_ocr_filter_kor', '0');  // 한글 포함 모드에서는 필터 OFF
          }
          setStatus('input-status', `OCR → ${langSel.options[langSel.selectedIndex].text} (다음 OCR 부터)`, 'ok');
        });
      }
    }

    // 하단 액션 바.
    $('ocr-back-btn').addEventListener('click', () => switchTab('normal'));
    // 🔄 다시 OCR — 현재 OCR 영역으로 새 캡처 + OCR. 결과는 OCR 탭에 갱신 (기존 블록 대체).
    $('ocr-rerun-btn').addEventListener('click', async () => {
      const btn = $('ocr-rerun-btn');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳';
      try {
        await runOcr();  // OCR 영역 설정되어 있으면 서버 OCR, 미설정 시 화면 crop fallback
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });
    $('ocr-add-blk').addEventListener('click', () => {
      addOcrBlock('');
      // 새 블록 포커스
      const codes = $('ocr-blocks-list').querySelectorAll('code[contenteditable]');
      if (codes.length > 0) codes[codes.length - 1].focus();
    });
    $('ocr-to-input').addEventListener('click', () => {
      const codes = $('ocr-blocks-list').querySelectorAll('code[contenteditable]');
      const text = Array.from(codes).map(c => c.textContent).join('\n');
      const inp = getActiveInputElem();
      inp.value = (inp.value + (inp.value ? '\n' : '') + text).trim();
      saveOcrFeedback(true);
      switchTab('normal');
      setStatus('input-status', `✓ ${codes.length}개 블록 → 입력 박스`, 'ok');
    });
    $('ocr-save-feedback').addEventListener('click', () => saveOcrFeedback(false));
    $('ocr-run-all').addEventListener('click', async () => {
      const codes = Array.from($('ocr-blocks-list').querySelectorAll('code[contenteditable]'));
      const blocks = codes.map(c => c.textContent.trim()).filter(t => t);
      if (blocks.length === 0) {
        setStatus('input-status', '✗ 붙여넣을 블록 없음', 'err');
        return;
      }
      $('ocr-run-all').disabled = true;
      try {
        // 모든 블록을 줄바꿈으로 이어 한 번에 paste — 엔터는 사용자가 직접.
        const joined = blocks.join('\n');
        await pasteBlockToTerminal(joined, `${blocks.length}개 블록 통합`);
        saveOcrFeedback(true);
      } finally {
        $('ocr-run-all').disabled = false;
        updateOcrMeta();
      }
    });

    // ----- Tailscale 자동 페어링 — 본인 휴대폰 같이 mesh 안 device 는 암호 불요 -----
    async function tryAutoPair() {
      try {
        const r = await fetch('/auto-pair', { method: 'POST', credentials: 'include' });
        if (r.ok) {
          setStatus('pair-status', '✓ Tailscale 자동 페어링', 'ok');
          $('pair-card').hidden = true;
          $('main-card').hidden = false;
          $('tabs').hidden = false;
          loadWindowList();
          startAlertPolling();
          return true;
        }
      } catch {}
      return false;
    }
    tryAutoPair();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
